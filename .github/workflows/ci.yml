name: CI

on:
  push:
    branches:
      - main
      - dev
      - macos
      - windows
      - android
  pull_request:

jobs:
  test:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo build --all-features
      - run: cargo test --all-features

  transfer-paths:
    name: Transfer path edges (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Transfer path codec unit tests
        run: cargo test --all-features --lib path_codec_

      - name: macOS transfer path integration tests
        if: runner.os == 'macOS'
        run: |
          cargo test --all-features --test transfer_test transfer_non_utf8_
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_non_utf8_output_name_over_relay_cli

      - name: Windows transfer path integration tests
        if: runner.os == 'Windows'
        run: |
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_reserved_windows_output_name_over_relay_cli
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_invalid_windows_char_output_name_over_relay_cli

  vpn-cross-build:
    name: VPN cross check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk (Android)
        if: contains(matrix.target, '-linux-android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Check (Android via NDK)
        if: contains(matrix.target, '-linux-android')
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          case "${{ matrix.target }}" in
            aarch64-linux-android) ARCH=arm64-v8a ;;
            x86_64-linux-android) ARCH=x86_64 ;;
          esac
          cargo ndk -t "$ARCH" check --features vpn

      - name: Check (host toolchain)
        if: '!contains(matrix.target, ''-linux-android'')'
        run: cargo check --features vpn --target ${{ matrix.target }}

      - name: Portable VPN unit tests (host)
        if: '!contains(matrix.target, ''-linux-android'')'
        run: cargo test --features vpn --lib

  # Real cargo test execution on a hosted windows-latest runner (not just the
  # cross-compile check above). Every non-VPN integration test (tests/e2e_test.rs,
  # secret_test.rs, vhost_test.rs, transfer_test.rs, udp_test.rs, etc.) plus the
  # VPN protocol/logic-level tests (relay, hub allocation, broker, routes) need
  # no elevation: no Command::new of an external binary, no /tmp, no Unix
  # sockets, no root. This is the Phase 4 (non-VPN parity) hosted e2e tier named
  # in the plan, mirroring the existing `macos-vpn-build` job shape. Whether the
  # hosted runner's default process token is ALSO already elevated enough for
  # real WinTun/host-networking mutation (routes, firewall, NAT, IPEnableRouter)
  # is a separate, previously-unverified question — answered empirically by the
  # `windows-vpn-e2e` job below, not assumed here.
  windows-vpn-build:
    name: Windows VPN build + non-VPN parity e2e (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn

      - run: cargo clippy --features vpn --all-targets -- -D warnings

      - run: cargo test --features vpn

      - run: cargo build --features vpn --example windows_vpn_spike

  # T-WIN-SMOKE (Phase 5.4): REAL single-host device tests on windows-latest —
  # WinTun adapter create/teardown, NetConfig apply/revert (routes, firewall,
  # WinNAT, IPEnableRouter), SIGKILL stale-reclaim, two-link ip_forward
  # refcount. Gating (no continue-on-error) so the Windows runtime is actually
  # exercised, not skipped — if the hosted runner's default process token turns
  # out to be insufficiently privileged for adapter/host-config mutation, this
  # job fails loudly and Phase 5.4 falls back to the original plan (self-hosted
  # admin runner, or the manual acceptance doc docs/vpn/VPN_WINDOWS_ACCEPTANCE.md).
  # Unlike macOS/Linux there is no `sudo` prefix here: whether that's needed at
  # all, or the hosted runner is already sufficiently privileged, is exactly
  # what this job's first real run determines (see diagnostic step).
  windows-vpn-e2e:
    name: Windows VPN device e2e (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn --example windows_vpn_spike

      - name: Fetch wintun.dll (pinned version+hash, see scripts/fetch_wintun.ps1)
        shell: pwsh
        run: ./scripts/fetch_wintun.ps1 -Arch amd64 -OutFile target/debug/examples/wintun.dll

      - name: Runner capability diagnostic
        shell: pwsh
        run: |
          Write-Host "## Windows runner capabilities"
          [System.Environment]::OSVersion | Out-String | Write-Host
          whoami /groups | Out-String | Write-Host
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Elevated (Administrator role): $isAdmin"
          Get-Service WinNat -ErrorAction SilentlyContinue | Out-String | Write-Host

      - name: De-risk spike (WinTun + host-config workflow)
        run: target/debug/examples/windows_vpn_spike.exe spike

      - name: WinTun adapter create / teardown (real device)
        run: target/debug/examples/windows_vpn_spike.exe create-teardown

      - name: Missing DLL fails cleanly
        run: target/debug/examples/windows_vpn_spike.exe missing-dll

      - name: Route add / delete (real adapter)
        run: target/debug/examples/windows_vpn_spike.exe route-add-del

      - name: Gateway apply / RAII revert (firewall + WinNAT + IPEnableRouter)
        run: target/debug/examples/windows_vpn_spike.exe apply-revert

      - name: Gateway without --forward-accept adds no firewall rules
        run: target/debug/examples/windows_vpn_spike.exe forward-accept-off-warn

      - name: Two-link ip_forward refcount
        run: target/debug/examples/windows_vpn_spike.exe two-link-refcount

      - name: SIGKILL stale-reclaim (leak then reclaim)
        run: |
          target/debug/examples/windows_vpn_spike.exe leak-then-reclaim leak
          target/debug/examples/windows_vpn_spike.exe leak-then-reclaim reclaim

  macos-vpn-build:
    name: macOS VPN build (macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn

      - run: cargo clippy --features vpn --all-targets -- -D warnings

      - run: cargo test --features vpn

      - run: cargo build --features vpn --example macos_vpn_spike

  # T-MAC-SMOKE: REAL single-host device tests on macos-14 under sudo (utun create,
  # gateway PF apply/revert, SIGKILL stale-reclaim). Gating (no continue-on-error)
  # so the macOS runtime is actually exercised, not skipped. The diagnostic step
  # records runner capabilities first; if a hosted runner forbids utun/PF even
  # under sudo, this job fails loudly — switch this job to a self-hosted macOS
  # runner (labels: [self-hosted, macOS, ARM64]) and the manual checklist
  # docs/vpn/VPN_MACOS_ACCEPTANCE.md remains the two-host acceptance.
  macos-vpn-e2e:
    name: macOS VPN device e2e (macos-14)
    runs-on: macos-14
    # Independent of macos-vpn-build: the real device tests (utun/PF) are the
    # point and should run even while unrelated test-corpus clippy is cleaned up.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn --example macos_vpn_spike

      - name: Runner capability diagnostic
        run: |
          echo "## macOS runner capabilities"
          sw_vers || true
          uname -a || true
          id || true
          echo "passwordless sudo:"; sudo -n true && echo "  OK" || echo "  NOT available"
          echo "ip.forwarding:"; sudo sysctl net.inet.ip.forwarding || true
          echo "pfctl status:"; sudo pfctl -s info 2>&1 | head -3 || true

      - name: De-risk spike (PF grammar + utun + sysctl)
        run: sudo target/debug/examples/macos_vpn_spike spike

      - name: utun create / teardown (real device)
        run: sudo target/debug/examples/macos_vpn_spike create-teardown

      - name: Gateway apply / RAII revert (real device + PF)
        run: sudo target/debug/examples/macos_vpn_spike apply-revert

      - name: SIGKILL stale-reclaim (leak then reclaim)
        run: |
          sudo target/debug/examples/macos_vpn_spike leak-then-reclaim leak
          sudo target/debug/examples/macos_vpn_spike leak-then-reclaim reclaim

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
