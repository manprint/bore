name: Docker (GHCR)

# A BRANCH push builds and publishes here directly -- that is a mutable,
# throwaway tag and the convenience is the point. A `v*` TAG does NOT: it is
# called by `release.yml`, which runs the full test matrix FIRST. Publishing an
# immutable release image that no gate had to pass is the defect this split
# exists to remove; do not put `tags:` back on this trigger, or a red test suite
# would ship `:v1.1.0` again.
on:
  push:
    branches:
      - "**" # every branch (mutable tags only -- see above)
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

# ghcr.io image. `github.repository_owner` (manprint) is already lowercase, as
# GHCR requires; if the owner ever has uppercase letters, lowercase it here.
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/bore

jobs:
  # ── Per-arch build, NATIVE runners (no QEMU) ───────────────────────────────
  # amd64 on ubuntu-latest, arm64 on ubuntu-24.04-arm (free for public repos).
  # Each job builds its single platform and pushes the image BY DIGEST (no tags
  # yet); the merge job assembles the multi-arch manifest with the real tags.
  # cargo-chef (see Dockerfile) caches the compiled-dependency layer; the gha
  # cache is scoped PER PLATFORM so the two jobs never clobber each other.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Prepare platform pair
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta (labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # push-by-digest: no tag here; the manifest in `merge` carries the tags.
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          build-args: |
            BORE_GIT_BRANCH=${{ github.ref_name }}
            BORE_GIT_SHA=${{ github.sha }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble the multi-arch manifest from the per-arch digests ─────────────
  merge:
    name: Merge manifest and push tags
    runs-on: ubuntu-latest
    needs: build
    # The `client` job below re-tags THIS run's image; it needs the tag the
    # metadata step actually resolved (semver on a tag push, slugified branch
    # name otherwise) rather than re-deriving it and risking a mismatch.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # BOTH spellings of a release tag, deliberately. `{{version}}` strips
          # the leading `v` (Docker convention, `:1.1.0`); the `v` spelling is
          # the form this project publishes and documents (`:v1.1.0`). They are
          # two tags on ONE manifest, so the second costs a registry pointer and
          # nothing else -- and dropping either would break whoever pinned that
          # spelling.
          #
          # THE `v` SPELLING COMES FROM `{{raw}}`, NOT FROM `v{{version}}`.
          # MEASURED on the v1.2.0-rc.1 release run (35137699783): a PRERELEASE
          # semver tag produced `1.2.0-rc.1` and NOTHING ELSE -- the
          # `v{{version}}` entry emitted no tag at all, so
          # `ghcr.io/manprint/bore:v1.2.0-rc.1` was `not found` while
          # `:1.2.0-rc.1` resolved, and the release body's three pins all read
          # `UNRESOLVED`. `{{raw}}` is the tag exactly as pushed, which is the
          # `v` spelling by construction and is emitted for a prerelease too.
          # For a stable tag the two are identical (`v1.1.0`), so this is not a
          # behaviour change there.
          #
          # `{{major}}.{{minor}}` staying as it is IS the intent: metadata-action
          # withholds it from a prerelease, which is what keeps `:1.2` from ever
          # pointing at a release candidate.
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # shellcheck disable=SC2046
          # The word splitting is the POINT on both lines: one manifest carries
          # every tag metadata-action resolved and every per-arch digest, so the
          # two substitutions must expand into SEPARATE argv entries. Quoting
          # them would pass "-t a -t b" as one argument and push a single image
          # named after the concatenation.
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # ── Root-running client variant, tag `:client` ─────────────────────────────
  # Same binary, no `USER 1000:1000` (see docker/Dockerfile.client for why the
  # non-root default silently loses CAP_NET_ADMIN even under --privileged).
  # Runs on EVERY pipeline run and moves `:client` to the image this run just
  # built, so `:client` always tracks the newest application build. The
  # immutable `client-<branch>` / `client-sha-<sha>` / `client-<version>` tags
  # stay available for pinning. `latest=false` is mandatory: without it a
  # `v*` tag push would move the real `:latest` onto the root image.
  client:
    name: Build and push :client (root)
    runs-on: ubuntu-latest
    needs: merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=client
            # `{{raw}}` and not `v{{version}}` -- see the note on the server
            # image above: the latter emits nothing for a prerelease tag.
            type=semver,pattern={{raw}},prefix=client-
            type=semver,pattern={{version}},prefix=client-
            type=semver,pattern=v{{major}}.{{minor}},prefix=client-
            type=semver,pattern={{major}}.{{minor}},prefix=client-
            type=ref,event=branch,prefix=client-
            type=sha,prefix=client-sha-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client
          # No RUN step (pure COPY from the just-published multi-arch image), so
          # both arches build on this amd64 runner without QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BORE_IMAGE=${{ env.REGISTRY_IMAGE }}:${{ needs.merge.outputs.version }}

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:client
