# Full docker-compose example for `bore server`.
# File name intentionally kept as requested: docker-compose-full-yml.ym
#
# Start:
#   docker compose -f docker-compose-full-yml.ym up -d
#
# Image override:
#   BORE_IMAGE=ghcr.io/youruser/bore:latest docker compose -f docker-compose-full-yml.ym up -d

networks:
  bore:
    driver: bridge

services:
  bore-server:
    image: ${BORE_IMAGE:-ghcr.io/manprint/bore:vhost_gpt}
    # To build locally instead of pulling, comment `image:` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    pull_policy: always
    container_name: bore-server

    # `command` can also carry options that do not have env vars, such as
    # --bind-addr and --bind-tunnels.
    command:
      - server
      # Only-CLI options without env vars:
      # - --bind-addr
      # - 0.0.0.0
      # - --bind-tunnels
      # - 0.0.0.0

    restart: unless-stopped
    networks:
      - bore

    # FILE DESCRIPTORS vs BORE_MAX_CONNS (P-12). The --max-conns semaphore
    # promises a GRACEFUL bound: at capacity one connection is dropped,
    # `conn_rejections` increments, every other connection keeps serving. That
    # promise needs one descriptor per admitted connection. Above the descriptor
    # limit the kernel refuses FIRST with EMFILE, and EMFILE lands on accept()
    # for EVERY listener the process owns -- so one tunnel's concurrency takes
    # down the admin API, the vhost frontends and every other tunnel. MEASURED
    # 2026-09-11 (docs/campagna-2026-09-13/evidenze/PUBLIC_STAGING_EVIDENCE_2026-09-11.md
    # section 11): BORE_MAX_CONNS=1024 against a soft RLIMIT_NOFILE of 1024, at
    # ~976 held connections through ONE tunnel, logged `No file descriptors
    # available (os error 24)` every 100 ms and answered nothing on its control
    # port for ~30 s -- while `conn_rejections` stayed 0, because the configured
    # bound was unreachable by construction.
    #
    # The server now RECONCILES this at startup, before it binds its first
    # listener: it raises its own SOFT limit to BORE_MAX_CONNS + 256 whenever
    # the HARD limit allows, and warns with both remedies when the hard limit is
    # itself short. A limit already sufficient is left alone and stays silent.
    # So this block is needed only when the container's HARD limit is below
    # BORE_MAX_CONNS + 256, which the default Docker daemon does not do.
    # Uncomment it if that startup warning ever appears.
    # ulimits:
    #   nofile:
    #     soft: 1048576
    #     hard: 1048576

    # Publish only the ports that match your chosen topology.
    ports:
      - "7835:7835"            # BORE_CONTROL_PORT TCP
      - "7835:7835/udp"        # STUN fallback / control UDP
      - "9000-9100:9000-9100"  # BORE_MIN_PORT..BORE_MAX_PORT tunnel range

      # Optional: expose control over a standard web port.
      - "443:7835"             # control over HTTPS when BORE_CERT_FILE/BORE_KEY_FILE are set
      # - "80:7835"            # control over plain HTTP when no control cert is set

      # Optional dedicated vhost frontend ports.
      - "80:80"                # BORE_VHOST_HTTP_PORT
      - "80:80/udp"            # vhost QUIC when HTTP-only and quic port = 80
      - "443:443/udp"          # BORE_VHOST_QUIC_PORT for vhost --udp
      # - "443:443"            # BORE_VHOST_HTTPS_PORT when using a dedicated HTTPS frontend

    environment:
      # --- Core server settings ---
      - BORE_SECRET=change-me
      - BORE_CONTROL_PORT=7835
      - BORE_MIN_PORT=9000
      - BORE_MAX_PORT=9100
      - BORE_MAX_CONNS=1024
      # Caps the TCP relay carrier pools (public / secret / vhost). Does NOT cap
      # the vhost `--udp` QUIC direct pool (provider-driven, 32/subdomain limit).
      - BORE_MAX_CARRIERS=128
      # Per-direction relay copy buffer (public/secret/vhost). Default 256KiB;
      # KB/MB/GB/KiB/MiB/GiB suffix, clamped [4KiB,16MiB]. Memory ~= size x 2 x
      # concurrent connections. Set the same value on provider processes for an
      # end-to-end large buffer on high-latency links. MEASURED 2026-09-11 over a
      # 40 ms path: 128KiB and 256KiB are indistinguishable (the difference between
      # two identical arms was larger than the difference between the two values),
      # so leave it unset unless you have measured your own path.
      # - BORE_PROXY_BUFFER_SIZE=1MiB

      # Optional public domain advertised to clients for http(s):// endpoints.
      - BORE_BIND_DOMAIN=bore.example.com

      # Optional admin status page token, minimum 32 characters.
      - BORE_ADMIN_TOKEN=replace-with-a-random-token-at-least-32-chars
      # HSTS for HTTPS control-port HTTP responses. Use `off` to disable.
      - BORE_CONTROL_HSTS=max-age=31536000; includeSubDomains

      # Optional TLS for the main control listener / https public tunnels.
      - BORE_CERT_FILE=/certs/cert.pem
      - BORE_KEY_FILE=/certs/key.pem

      # --- UDP direct path for secret tunnels ---
      - BORE_UDP=true
      # ------------------------------------------------------------------
      # HOST PREREQUISITE for BORE_UDP -- the UDP socket buffer (P-13).
      # ------------------------------------------------------------------
      # bore asks every QUIC endpoint's socket for 16MiB inside the endpoint
      # constructor, and the kernel SILENTLY CLAMPS that request to
      # net.core.rmem_max / net.core.wmem_max.
      #
      # THE VALUE THAT PRODUCED THE FAILURE IS NOT THE VALUE TO CHECK. P-13's
      # defect was that the server's SHARED endpoint -- the one serving the
      # direct path of every vhost, public and ssh-jump tunnel in this process,
      # and the RECEIVING side of every download -- never ASKED, so it ran on
      # net.core.rmem_DEFAULT: 212992 bytes, which at 111 MB/s holds 1.9 ms of
      # traffic. It asks now, and what it gets is min(16MiB, net.core.rmem_MAX).
      #
      # CHECK YOUR OWN KERNEL, because that ceiling has moved. MEASURED
      # 2026-09-13 on two AWS hosts running 7.0.0-*-aws, neither of which
      # carries a sysctl file for it:
      #
      #   net.core.rmem_max      4194304   <- kernel default now 4MiB
      #   net.core.wmem_max      4194304
      #   net.core.rmem_default   212992   <- unchanged, and still exactly what
      #                                       an un-asking socket would get
      #
      # Older kernels ship 212992 for all three. So on an older host the clamp
      # sits 16x below the request and IS the P-13 failure; on 7.0 it sits 4x
      # below it and still covers the bandwidth-delay product of a 22 ms,
      # 1 Gbit/s path (2.6 MB) with room left. Raising it to 16MiB has NOT been
      # measured to buy anything on such a path -- the measurement below is the
      # 208KiB case, which is 16x smaller. Raise it when bore warns, and when
      # rate x RTT approaches the ceiling; the socket is ONE per endpoint, so
      # the rate to use is the server's aggregate, not one tunnel's.
      #
      # MEASURED
      # 2026-09-11 (docs/campagna-2026-09-13/evidenze/PUBLIC_STAGING_EVIDENCE_2026-09-11.md
      # section 13.1): the direct arm took IN 3.885 GiB to DELIVER 2.279
      # (1.78x -- retransmission, not per-packet overhead) while the relay
      # arm's inbound and outbound agreed to 0.2 %. It cost half the goodput
      # (111 vs 213 MB/s), double the CPU per delivered GiB and 2.9x softirq.
      #
      # A CONTAINER CANNOT SET THIS ITSELF. net.core.* is global, not
      # per-network-namespace, so a `sysctls:` entry here does not work -- the
      # daemon refuses the container outright. VERIFIED 2026-09-13, Docker
      # 29.8.0:
      #
      #   docker run --sysctl net.core.rmem_max=16777216 alpine:3 true
      #   -> Error response from daemon: ... open sysctl net.core.rmem_max
      #      file: reopen fd 8: permission denied
      #
      # Set it on the HOST instead:
      #
      #   sudo sysctl -w net.core.rmem_max=16777216
      #   sudo sysctl -w net.core.wmem_max=16777216
      #   # persist across reboots:
      #   printf 'net.core.rmem_max=16777216\nnet.core.wmem_max=16777216\n' \
      #     | sudo tee /etc/sysctl.d/99-bore-udp.conf
      #
      # The other half of the remedy is CAP_NET_ADMIN, which lets bore call
      # SO_*BUFFORCE and bypass the clamp -- but Docker clears every capability
      # for a non-root UID even under `privileged`, so that path needs the ROOT
      # image. VERIFIED IN THE FIELD 2026-09-13 on a deployment that DOES set
      # `privileged: true` and still runs as UID 1000: bore logged
      # `recv_forced=false effective_recv=8388608` against a 16777216 request,
      # i.e. privileged bought it nothing and the host ceiling was the only
      # limit that applied. The sysctl is the simpler half and is sufficient on
      # its own: after raising it, the same server logged
      # `effective_recv=33554432 forced=false` and `ss` reported rb33554432
      # with the socket's kernel drop counter back to 0 from 5224.
      #
      # VERIFY FROM THE KERNEL, never from the log: `ss -uapm` on the server
      # and read the rb/tb fields of bore's UDP socket. bore additionally warns
      # on any socket whose 16MiB request survived clamped.
      #
      # These five are EXACTLY the built-in defaults (src/shared.rs DIRECT_QUIC_*),
      # shown for visibility. Leaving them commented is identical to setting them.
      # KEEP THE 16:1 RATIO between the connection and the stream window: at
      # --carriers 1 every proxied connection is a bidi stream on ONE QUIC
      # connection, so conn/stream is how many stalled streams starve all the
      # others. 64MiB gave ~4 and produced the vhost "asset stuck pending" stall
      # (docs/vhost/VHOST_UDP_CONCURRENCY_FIX.md); 256MiB tolerates ~16.
      # - BORE_UDP_STREAM_RECEIVE_WINDOW=16MiB
      # - BORE_UDP_CONNECTION_RECEIVE_WINDOW=256MiB
      # - BORE_UDP_SEND_WINDOW=256MiB
      # - BORE_UDP_SOCKET_RECV_BUFFER=16MiB
      # - BORE_UDP_SOCKET_SEND_BUFFER=16MiB
      # - BORE_UDP_MAX_STREAMS=4096
      # Recommended instead of the three window variables: one server-wide ceiling
      # on the memory the direct UDP path may commit. Measured 2026-09-11: peak
      # server RSS 340.4 -> 42.2 MiB with 48 slow readers, at no throughput cost.
      # Conflicts with the three windows above; derives them from this one number.
      # - BORE_UDP_MEMORY_BUDGET=512MiB

      # --- Vhost frontend ---
      # You can enable vhost either with BORE_VHOST_BASE_DOMAIN alone or with a
      # config file. The file is required for request/response header injection
      # (`default_headers`, `default_response_headers`) and `reservations`.
      - BORE_VHOST_CONFIG=/vhost/config-full.example.yml
      - BORE_VHOST_BASE_DOMAIN=bore.example.com
      - BORE_VHOST_MODE=auto
      - BORE_VHOST_HTTP_PORT=80
      - BORE_VHOST_HTTPS_PORT=443
      - BORE_VHOST_QUIC_PORT=443
      - BORE_VHOST_CERT_FILE=/certs/cert.pem
      - BORE_VHOST_KEY_FILE=/certs/key.pem

      # Examples of valid alternatives:
      # - BORE_VHOST_MODE=http
      # - BORE_VHOST_MODE=https
      # - BORE_VHOST_MODE=both
      # - BORE_VHOST_MODE=redirect-https

      #
      # --- Web transfer (browser-to-browser rooms on the control port) ---
      # DISABLED until BORE_WEB_TRANSFER_BASE_URL is set. That is not a
      # convenience: the base URL is what the server compares every WebSocket
      # `Origin` and `Host` against, so a server with no base URL has no
      # same-origin boundary to enforce and refuses to serve the feature at
      # all rather than serve it unguarded.
      #
      # NO NEW PORTS. The room shell, the control socket and the relay all
      # ride the control port already published above, and the DIRECT path is
      # browser-to-browser WebRTC negotiated by the two peers themselves —
      # this container opens no UDP socket for it (gated by
      # `web_transfer_opens_no_udp_socket`). STUN is an OUTBOUND client
      # concern; the servers in the list are contacted by the browsers, not
      # by bore.
      #
      # The URL must be the origin a USER types, including the scheme and any
      # non-default port, with a trailing slash:
      # - BORE_WEB_TRANSFER_BASE_URL=https://bore.mydomain.com/
      #
      # Behind a reverse proxy, the hop from the proxy to bore may be plain
      # HTTP on loopback while the base URL stays the public HTTPS origin —
      # but the proxy MUST pass `Host` and `Origin` through unchanged (bore
      # never trusts `X-Forwarded-*`), MUST allow the HTTP/1.1 `Upgrade`
      # handshake on /transfer/ws/*, MUST NOT buffer or compress those
      # connections, and MUST allow them to stay open: the control socket is
      # idle between heartbeats, so a proxy read timeout below ~70 s cuts
      # healthy rooms.
      #
      # STUN servers the BROWSERS use to find each other; empty list or
      # BORE_WEB_TRANSFER_NO_STUN=true keeps them on host candidates (a LAN
      # works, most NATs do not, and the relay takes over). No TURN.
      # - BORE_WEB_TRANSFER_STUN=stun:stun.cloudflare.com:3478,stun:stun.l.google.com:19302
      # - BORE_WEB_TRANSFER_NO_STUN=false
      #
      # Capacity. Every one of these is a CONFIGURED total, published on
      # /admin/api/v1/config and never confused with the live gauges on
      # /admin/api/v1/metrics. Defaults shown; leaving them commented is the
      # same as setting them and picks up a future change to the tested
      # values.
      # - BORE_WEB_TRANSFER_MAX_ROOMS=1024
      # - BORE_WEB_TRANSFER_MAX_PEERS=4096
      # - BORE_WEB_TRANSFER_MAX_PEERS_PER_ROOM=32
      # - BORE_WEB_TRANSFER_MAX_OFFERS_PER_PEER=64
      # - BORE_WEB_TRANSFER_MAX_ENTRIES_PER_OFFER=10000
      # - BORE_WEB_TRANSFER_MAX_OFFER_BYTES=1099511627776
      # - BORE_WEB_TRANSFER_MAX_METADATA_PER_ROOM=16777216
      # - BORE_WEB_TRANSFER_MAX_METADATA_TOTAL=268435456
      # - BORE_WEB_TRANSFER_MAX_TRANSFERS_PER_PEER=8
      # - BORE_WEB_TRANSFER_MAX_RELAYS=256
      # - BORE_WEB_TRANSFER_RELAY_RATE=104857600
      # - BORE_WEB_TRANSFER_OWNER_GRACE=60
      #
      # NO VOLUME IS NEEDED, and none should be added. The server holds no
      # payload: relayed frames are opaque ciphertext passed between two
      # sockets and never touch the filesystem, so this service is compatible
      # with a read-only root filesystem and every file a room produces lives
      # in the RECIPIENT's browser (OPFS).
    volumes:
      - ./certs:/certs:ro
      - ./config-full.example.yml:/vhost/config-full.example.yml:ro

    # Linux production alternative when Docker bridge NAT breaks STUN/reflexive UDP:
    # network_mode: host
    # In that case comment out `networks:` and the whole `ports:` block.
