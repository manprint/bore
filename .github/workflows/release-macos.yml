# Release / macOS — the Darwin half of a release, on its own clock.
#
# WHY THIS IS A SEPARATE WORKFLOW
# -------------------------------
# `release.yml` gates and publishes everything EXCEPT macOS (see "macOS IS NOT
# IN THIS RUN" there): hosted arm64 macOS runners are routinely unavailable, and
# a release that waits for them ships nothing on any platform. This workflow
# runs ONLY the macOS legs of the same gates and, when they are green, attaches
# `bore-x86_64-apple-darwin` / `bore-aarch64-apple-darwin` (raw + .tar.gz) to
# the release that already exists. The rule `release.yml` exists for is kept: no
# Darwin binary is published before its own gates.
#
# TWO HALVES, ONE FILE
# --------------------
#   dispatch   on a BRANCH ref — which is where `schedule` always runs. Finds
#              the newest version-tag release, and if it still lacks a Darwin
#              asset starts THIS workflow on that tag (or re-runs only the
#              failed jobs of the previous attempt, so a night that got three
#              runners out of eight does not have to win all eight again).
#   gates +    on a TAG ref. `github.ref`, `GITHUB_REF_NAME` and `GITHUB_SHA`
#   publish    are then the tag's own, so `ci/version.bash`, `build.rs` and
#              every checkout resolve exactly as they do in `release.yml`,
#              with no `ref:` plumbing to drift.
#
# The build half therefore runs the workflow files AS THEY ARE AT THE TAG. A tag
# older than this file cannot be completed by it.
#
# By hand, when runners are known to be there:
#   gh workflow run release-macos.yml --ref v1.4.0     # build that tag now
#   gh workflow run release-macos.yml                  # same as the nightly
#   gh workflow run release-macos.yml --ref <branch> -f rehearse=true   # gates only
name: Release / macOS

on:
  schedule:
    # Three attempts per night (UTC). Each one is a few seconds on ubuntu when
    # there is nothing to do or an attempt is still in flight.
    - cron: "17 23,1,3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to complete. Empty = the newest version-tag release. Ignored when the run itself is on a tag ref."
        type: string
        default: ""
      rehearse:
        description: "Run the macOS gates on THIS ref and publish nothing. For checking this workflow itself from a branch."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Find a release without Darwin assets
    if: github.ref_type != 'tag' && !inputs.rehearse
    runs-on: ubuntu-latest
    permissions:
      actions: write # start / re-run this workflow on the tag
      contents: read
    steps:
      - name: Start or resume the macOS half
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then
            # Newest first. Branch builds (`dev-<sha7>`) are releases too and
            # are not what this is for.
            TAG=$(gh release list --limit 50 --json tagName \
              --jq '[.[].tagName | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.]+)?$"))][0] // ""')
          fi
          if [ -z "$TAG" ]; then
            echo "no version-tag release found — nothing to do"
            exit 0
          fi
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH[-prerelease]"
            exit 1
          fi
          echo "release: $TAG"

          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          missing=""
          for t in x86_64-apple-darwin aarch64-apple-darwin; do
            for a in "bore-$t" "bore-$TAG-$t.tar.gz"; do
              grep -qxF "$a" <<<"$ASSETS" || missing="$missing $a"
            done
          done
          if [ -z "$missing" ]; then
            echo "$TAG already carries every Darwin asset — nothing to do"
            exit 0
          fi
          echo "missing:$missing"

          # The previous attempt on this tag, if any. `--branch` filters on
          # `head_branch`, which for a tag-ref run is the tag name.
          PREV=$(gh run list --workflow release-macos.yml --branch "$TAG" \
            --event workflow_dispatch --limit 1 \
            --json databaseId,status,conclusion \
            --jq '.[0] | select(. != null) | "\(.databaseId) \(.status) \(.conclusion)"')
          if [ -n "$PREV" ]; then
            read -r ID STATUS CONCLUSION <<<"$PREV"
            echo "previous attempt: run $ID status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" != "completed" ]; then
              echo "still in flight — leaving it alone"
              exit 0
            fi
            if [ "$CONCLUSION" != "success" ] && gh run rerun "$ID" --failed; then
              echo "re-running the failed jobs of run $ID"
              exit 0
            fi
          fi

          gh workflow run release-macos.yml --ref "$TAG"
          echo "started release-macos.yml on $TAG"

  # ── The macOS legs of the same gates `release.yml` runs. Reused, never copied.
  gate-ci:
    name: Gate / CI matrix (macOS legs)
    if: github.ref_type == 'tag' || inputs.rehearse
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      platforms: macos-only

  gate-cross:
    name: Gate / cross-architecture (Darwin)
    if: github.ref_type == 'tag' || inputs.rehearse
    permissions:
      contents: read
    uses: ./.github/workflows/mean_bean_ci.yml
    with:
      platforms: macos-only

  publish-binaries:
    name: Publish / Darwin binaries
    needs: [gate-ci, gate-cross]
    # Never from a rehearsal: on a branch ref this would attach Darwin binaries
    # to a `<branch>-<sha7>` build, not to a release.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    secrets: inherit
    uses: ./.github/workflows/mean_bean_deploy.yml
    with:
      platforms: macos-only
