name: CI

on:
  push:
    branches:
      - "**" # every branch: run the full CI matrix on any push
  pull_request:
  # Callable so `release.yml` gates a tag on THIS matrix rather than a copy of
  # it. A release gate that duplicated these jobs would drift from them, and the
  # drift would only ever be discovered by shipping something CI had not run.
  workflow_call:
  # The branded-channel smoke below is opt-in: Chrome, Edge and Brave are not on
  # every runner image, and a job that quietly skips them is worse than one
  # that never ran.
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Run ONE slice instead of the whole matrix. The browser slice is the
          job that churns most, and waiting 15 minutes for the other twelve to
          agree with it is time spent learning nothing.
        type: choice
        default: all
        options:
          - all
          - web-transfer
  schedule:
    - cron: "37 4 * * 1"

jobs:
  test:
    name: Build, test & lint
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      - run: cargo build --all-features
      # ssh_gateway_test/ssh_gateway_spike_test spawn real ssh processes + bind
      # real ports; under the hosted runner's default (CPU-count) parallel
      # test threads they intermittently hit "connection reset"/"early eof"
      # from resource contention. Run the rest of the suite normally, then
      # run just those two binaries single-threaded.
      #
      # `t_web_soak` is skipped here and NOT re-run in this job: it is the
      # heaviest test in the repository (32 peers, 2048 offers, 740 MiB moved,
      # 80 s) and it MEASURES a budget coming back, so a runner that starves
      # its server makes it report a leak that is not there — it failed once
      # with peer 0 of 32 refused, having been green on the three runs before
      # it, while the `web-transfer` job ran the SAME binary serially and
      # passed. That job owns `web_transfer_test` with `--test-threads=1`,
      # which is where a test that binds real ports belongs; running it here
      # too only bought a second, contended copy.
      #
      # So the WHOLE binary is left out here, not just the soak: skipping one
      # test left the other forty running in parallel, and they failed the
      # same way on their own — `t_web_room_life` (d7f7839e), then
      # `admin_web_transfer_fields_are_additive_and_match_the_fixture` with
      # "Connection reset by peer" (e621c4a) — while the serial copy in the
      # web-transfer job passed on the same commit. The target list is built
      # from `tests/*.rs`, so a new integration test is picked up without
      # touching this file.
      - name: cargo test (all targets except web_transfer_test, which runs serially below)
        run: |
          targets=()
          for file in tests/*.rs; do
            name=$(basename "$file" .rs)
            [ "$name" = web_transfer_test ] && continue
            targets+=(--test "$name")
          done
          cargo test --all-features --lib --bins --examples "${targets[@]}" -- --skip t_ssh_ --skip t_dmx_
          cargo test --all-features --doc
      - name: Admin UI unit tests
        run: npm test
      - run: cargo test --all-features --test ssh_gateway_test --test ssh_gateway_spike_test -- --test-threads=1

  transfer-link:
    name: Transfer link (Rust + HTTPS smoke)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Transfer-link integration tests (QUIC and no-UDP builds)
        run: |
          cargo test --all-features --test transfer_link_test -- --test-threads=1
          cargo test --no-default-features --test transfer_link_test -- --test-threads=1

      - name: Transfer-link HTTPS client smoke
        run: bash scripts/transfer_link_e2e.sh basic

      - name: Transfer-link performance smoke
        run: bash scripts/transfer_link_perf.sh

  transfer-link-docker:
    name: Transfer link (Docker client)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Docker transfer-link acceptance
        run: bash scripts/transfer_link_container_test.sh

  fast-link:
    name: Fast link transfer (curl/wget e2e + bandwidth)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fast link end-to-end (real curl and wget)
        run: bash scripts/fast_link_e2e.sh

      - name: Fast link bandwidth vs vhost relay + transit proof
        run: bash scripts/fast_link_perf.sh

  transfer-paths:
    name: Transfer path edges (${{ matrix.os }})
    if: inputs.only != 'web-transfer'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Transfer path codec unit tests
        run: cargo test --all-features --lib path_codec_

      - name: macOS transfer path integration tests
        if: runner.os == 'macOS'
        run: |
          cargo test --all-features --test transfer_test transfer_non_utf8_
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_non_utf8_output_name_over_relay_cli

      - name: Windows transfer path integration tests
        if: runner.os == 'Windows'
        run: |
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_reserved_windows_output_name_over_relay_cli
          cargo test --all-features --test transfer_stdin_cli_test transfer_stdin_invalid_windows_char_output_name_over_relay_cli

  web-transfer:
    name: Web transfer (browser slice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/transfer/package-lock.json

      - name: Install browser peer dependencies
        working-directory: web/transfer
        run: npm ci

      # Unit tests, a fresh bundle and the drift check in one command: the
      # binary embeds `web/transfer/dist` at compile time, so a stale bundle
      # would make every browser test below exercise yesterday's app.
      - name: Unit tests, bundle and drift check
        working-directory: web/transfer
        run: npm run check

      - name: Fail on an uncommitted bundle
        run: git diff --exit-code -- web/transfer/dist

      # Built AFTER the bundle, for the same reason.
      - name: Build the server and the e2e room owner
        run: cargo build --all-features --bin bore --example web_transfer_e2e_owner

      # Serial: these tests bind real ports and spawn real server processes,
      # and a parallel run fabricates failures out of the contention.
      - name: Rust web-transfer suite (serial)
        run: cargo test --all-features --test web_transfer_test -- --test-threads=1

      - name: Install Playwright browsers
        working-directory: web/transfer
        run: npx playwright install --with-deps chromium firefox webkit

      # The three engines run in the `web-transfer-e2e` matrix below, one
      # runner each. They used to run here, all three on this runner, and the
      # suite outgrew it: 180 tests, two Playwright workers, four browser
      # contexts and two server processes on four vCPUs, with BLAKE3 hashing
      # a folder inside the page. What that produced was ONE failure per run
      # and a different test each time — twice a claim the environment could
      # not meet, once a control socket the page lost and spent the rest of
      # the test reconnecting (`Riconnessione…` in the failure snapshot).
      # Splitting by engine gives each one a whole runner and a third of the
      # tests, at the same wall clock, and an engine-specific failure lands
      # in its own job instead of being one line in three engines' output.

      # The pairs nobody else runs: every other spec puts the same engine on
      # both sides, and a transfer is a NEGOTIATION between two of them.
      # Driven by one project because the spec names its own engines.
      - name: Cross-engine pair matrix (T-WEB-CROSS)
        working-directory: web/transfer
        run: npx playwright test cross.spec.mjs --project=chromium --reporter=line

      # Budgeted, seeded, and printed: a crash found here reproduces exactly
      # with BORE_WEB_FUZZ_SEED. Ten seconds per decoder in CI; the plan's
      # 60 s run is the same test with a bigger budget.
      - name: Decoder fuzzing (CI budget)
        env:
          BORE_WEB_FUZZ_SECS: 10
        run: cargo test --all-features --test web_transfer_fuzz -- --nocapture

      # The claim `cargo install bore-cli` needs no Node is about the PACKED
      # crate, not about this checkout.
      - name: Crate artifact serves the shell (T-WEB-PACKAGE)
        run: bash scripts/web_transfer_package_test.sh

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-transfer-playwright
          path: web/transfer/test-results
          retention-days: 7

  web-transfer-e2e:
    name: Web transfer e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      # Never cancel a sibling: an engine-specific failure is exactly the
      # thing this split exists to show, and the other two engines' verdicts
      # are what say whether it is the engine or the change.
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/transfer/package-lock.json

      - name: Install browser peer dependencies
        working-directory: web/transfer
        run: npm ci

      # The bundle only. The unit tests and the drift check belong to the
      # `web-transfer` job and running them here would run them three times.
      - name: Build the browser bundle
        working-directory: web/transfer
        run: npm run build

      # Built AFTER the bundle: the binary embeds it at compile time.
      - name: Build the server and the e2e room owner
        run: cargo build --all-features --bin bore --example web_transfer_e2e_owner

      - name: Install Playwright browser
        working-directory: web/transfer
        run: npx playwright install --with-deps ${{ matrix.project }}

      # ONE worker, and `T-WEB-CROSS` excluded.
      #
      # The cross-engine spec names its own engines, so it cannot run in a job
      # that installed one of them; it keeps running in the `web-transfer` job,
      # which installs all three.
      #
      # The worker count is the lever this split was really about. Playwright
      # defaults to half the vCPUs, so the runner drives two tests at once —
      # two rooms, four browser contexts and two server processes on four
      # vCPUs — and each context BLAKE3-hashes its share of the payload. With
      # all three engines on one runner the pressure at least fell on three
      # different engines; with one engine per runner it falls twice on the
      # heaviest one, which is how firefox started losing its direct leg
      # before the gate's own byte threshold (`killedAt: 0`, and a
      # `channel-closed` the product correctly survives by falling back). One
      # worker gives each test the whole runner, which is the condition the
      # same suite passes under locally, and the three engines still run at
      # once because they are three jobs.
      - name: Browser e2e (${{ matrix.project }})
        working-directory: web/transfer
        run: >-
          npx playwright test --project=${{ matrix.project }}
          --grep-invert "T-WEB-CROSS" --workers=1 --reporter=line

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-transfer-playwright-${{ matrix.project }}
          path: web/transfer/test-results
          retention-days: 7

  web-transfer-branded:
    name: Web transfer (branded Chrome/Edge/Brave smoke)
    # Only on the weekly schedule or an explicit web-transfer dispatch: on a
    # push it would either double the matrix or report a skip that reads like
    # a pass. The explicit input is important: `only: web-transfer` must not
    # accidentally suppress this job.
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.only == 'web-transfer')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/transfer/package-lock.json

      - name: Install browser peer dependencies
        working-directory: web/transfer
        run: npm ci

      - name: Bundle and build the server
        run: |
          npm run build --prefix web/transfer
          cargo build --all-features --bin bore --example web_transfer_e2e_owner

      # `install chrome msedge` fails loudly when a channel cannot be
      # installed on this image, which is the report we want — not a skip.
      - name: Install branded channels
        working-directory: web/transfer
        run: npx playwright install --with-deps chrome msedge

      - name: Install Brave browser
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl
          sudo install --directory --mode=0755 /etc/apt/keyrings
          curl --fail --silent --show-error --location \
            --output /tmp/brave-browser-archive-keyring.gpg \
            https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo install --owner=root --group=root --mode=0644 \
            /tmp/brave-browser-archive-keyring.gpg \
            /etc/apt/keyrings/brave-browser-archive-keyring.gpg
          cat <<'EOF' | sudo tee /etc/apt/sources.list.d/brave-browser-release.sources >/dev/null
          Types: deb
          URIs: https://brave-browser-apt-release.s3.brave.com/
          Suites: stable
          Components: main
          Signed-By: /etc/apt/keyrings/brave-browser-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install --yes brave-browser

      - name: Preflight branded browsers
        run: |
          command -v brave-browser
          brave-browser --version
          command -v google-chrome
          google-chrome --version
          command -v microsoft-edge
          microsoft-edge --version

      - name: Branded smoke (T-WEB-BRANDED)
        working-directory: web/transfer
        run: npm run test:e2e:branded

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-transfer-branded
          path: web/transfer/test-results
          retention-days: 7

  vpn-cross-build:
    name: VPN cross check (${{ matrix.target }})
    if: inputs.only != 'web-transfer'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-linux-android
            os: ubuntu-latest
          - target: x86_64-linux-android
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk (Android)
        if: contains(matrix.target, '-linux-android')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Clippy (Android via NDK)
        if: contains(matrix.target, '-linux-android')
        env:
          ANDROID_API: "24" # must match Justfile's android_api
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          case "${{ matrix.target }}" in
            aarch64-linux-android) ARCH=arm64-v8a ;;
            x86_64-linux-android) ARCH=x86_64 ;;
          esac
          cargo ndk -t "$ARCH" -P "$ANDROID_API" clippy --all-targets -- -D warnings
          cargo ndk -t "$ARCH" -P "$ANDROID_API" clippy --all-targets --features vpn -- -D warnings

      - name: Check (host toolchain)
        if: '!contains(matrix.target, ''-linux-android'')'
        run: cargo check --features vpn --target ${{ matrix.target }}

      - name: Portable VPN unit tests (host)
        if: '!contains(matrix.target, ''-linux-android'')'
        run: cargo test --features vpn --lib

  # Real cargo test execution on a hosted windows-latest runner (not just the
  # cross-compile check above). Every non-VPN integration test (tests/e2e_test.rs,
  # secret_test.rs, vhost_test.rs, transfer_test.rs, udp_test.rs, etc.) plus the
  # VPN protocol/logic-level tests (relay, hub allocation, broker, routes) need
  # no elevation: no Command::new of an external binary, no /tmp, no Unix
  # sockets, no root. This is the Phase 4 (non-VPN parity) hosted e2e tier named
  # in the plan, mirroring the existing `macos-vpn-build` job shape. Whether the
  # hosted runner's default process token is ALSO already elevated enough for
  # real WinTun/host-networking mutation (routes, firewall, NAT, IPEnableRouter)
  # is a separate, previously-unverified question — answered empirically by the
  # `windows-vpn-e2e` job below, not assumed here.
  windows-vpn-build:
    name: Windows VPN build + non-VPN parity e2e (windows-latest)
    if: inputs.only != 'web-transfer'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn

      - run: cargo clippy --features vpn --all-targets -- -D warnings

      - run: cargo test --features vpn

      - run: cargo build --features vpn --example windows_vpn_spike

  # T-WIN-SMOKE (Phase 5.4): REAL single-host device tests on windows-latest —
  # WinTun adapter create/teardown, NetConfig apply/revert (routes, firewall,
  # WinNAT, IPEnableRouter), SIGKILL stale-reclaim, two-link ip_forward
  # refcount. Gating (no continue-on-error) so the Windows runtime is actually
  # exercised, not skipped — if the hosted runner's default process token turns
  # out to be insufficiently privileged for adapter/host-config mutation, this
  # job fails loudly and Phase 5.4 falls back to the original plan (self-hosted
  # admin runner, or the manual acceptance doc docs/vpn/VPN_WINDOWS_ACCEPTANCE.md).
  # Unlike macOS/Linux there is no `sudo` prefix here: whether that's needed at
  # all, or the hosted runner is already sufficiently privileged, is exactly
  # what this job's first real run determines (see diagnostic step).
  windows-vpn-e2e:
    name: Windows VPN device e2e (windows-latest)
    if: inputs.only != 'web-transfer'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn --example windows_vpn_spike

      - name: Fetch wintun.dll (pinned version+hash, see scripts/fetch_wintun.ps1)
        shell: pwsh
        run: ./scripts/fetch_wintun.ps1 -Arch amd64 -OutFile target/debug/examples/wintun.dll

      - name: Runner capability diagnostic
        shell: pwsh
        run: |
          Write-Host "## Windows runner capabilities"
          [System.Environment]::OSVersion | Out-String | Write-Host
          whoami /groups | Out-String | Write-Host
          $isAdmin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Elevated (Administrator role): $isAdmin"
          Get-Service WinNat -ErrorAction SilentlyContinue | Out-String | Write-Host

      - name: De-risk spike (WinTun + host-config workflow)
        run: target/debug/examples/windows_vpn_spike.exe spike

      - name: WinTun adapter create / teardown (real device)
        run: target/debug/examples/windows_vpn_spike.exe create-teardown

      - name: Missing DLL fails cleanly
        run: target/debug/examples/windows_vpn_spike.exe missing-dll

      - name: Route add / delete (real adapter)
        run: target/debug/examples/windows_vpn_spike.exe route-add-del

      - name: Gateway apply / RAII revert (firewall + WinNAT + IPEnableRouter)
        run: target/debug/examples/windows_vpn_spike.exe apply-revert

      - name: Gateway without --forward-accept adds no firewall rules
        run: target/debug/examples/windows_vpn_spike.exe forward-accept-off-warn

      - name: Two-link ip_forward refcount
        run: target/debug/examples/windows_vpn_spike.exe two-link-refcount

      - name: SIGKILL stale-reclaim (leak then reclaim)
        run: |
          target/debug/examples/windows_vpn_spike.exe leak-then-reclaim leak
          target/debug/examples/windows_vpn_spike.exe leak-then-reclaim reclaim

  macos-vpn-build:
    name: macOS VPN build (macos-14)
    if: inputs.only != 'web-transfer'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn

      - run: cargo clippy --features vpn --all-targets -- -D warnings

      - run: cargo test --features vpn

      - run: cargo build --features vpn --example macos_vpn_spike

  # T-MAC-SMOKE: REAL single-host device tests on macos-14 under sudo (utun create,
  # gateway PF apply/revert, SIGKILL stale-reclaim). Gating (no continue-on-error)
  # so the macOS runtime is actually exercised, not skipped. The diagnostic step
  # records runner capabilities first; if a hosted runner forbids utun/PF even
  # under sudo, this job fails loudly — switch this job to a self-hosted macOS
  # runner (labels: [self-hosted, macOS, ARM64]) and the manual checklist
  # docs/vpn/VPN_MACOS_ACCEPTANCE.md remains the two-host acceptance.
  macos-vpn-e2e:
    name: macOS VPN device e2e (macos-14)
    if: inputs.only != 'web-transfer'
    runs-on: macos-14
    # Independent of macos-vpn-build: the real device tests (utun/PF) are the
    # point and should run even while unrelated test-corpus clippy is cleaned up.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --features vpn --example macos_vpn_spike

      - name: Runner capability diagnostic
        run: |
          echo "## macOS runner capabilities"
          sw_vers || true
          uname -a || true
          id || true
          echo "passwordless sudo:"; sudo -n true && echo "  OK" || echo "  NOT available"
          echo "ip.forwarding:"; sudo sysctl net.inet.ip.forwarding || true
          echo "pfctl status:"; sudo pfctl -s info 2>&1 | head -3 || true

      - name: De-risk spike (PF grammar + utun + sysctl)
        run: sudo target/debug/examples/macos_vpn_spike spike

      - name: utun create / teardown (real device)
        run: sudo target/debug/examples/macos_vpn_spike create-teardown

      - name: Gateway apply / RAII revert (real device + PF)
        run: sudo target/debug/examples/macos_vpn_spike apply-revert

      - name: SIGKILL stale-reclaim (leak then reclaim)
        run: |
          sudo target/debug/examples/macos_vpn_spike leak-then-reclaim leak
          sudo target/debug/examples/macos_vpn_spike leak-then-reclaim reclaim

  # T-AND-E-CI: non-VPN runtime validation on a real Android emulator (x86_64,
  # api 30) via scripts/android_emu_test.sh — public tunnel, transfer, secret
  # tunnel, test-udp diagnostic, public --udp direct path, non-root negative
  # bind, all run as the guest's unprivileged shell user against a host bore
  # server. Independent job (no needs/if gating), mirrors macos-vpn-e2e's
  # placement/style. Phase 2 of docs/plans/plan_AndroidSupport.
  android-emu-e2e:
    name: Android emulator e2e (api 30, x86_64)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24" # must match Justfile's android_api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build host binary
        run: cargo build --release

      - name: Build Android binary (x86_64, via cargo-ndk)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t x86_64 -P "$ANDROID_API" build --release

      - name: Run emulator + e2e (T-AND-E1..E6)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          script: BORE_HOST_BIN=$PWD/target/release/bore BORE_ANDROID_BIN=$PWD/target/x86_64-linux-android/release/bore ./scripts/android_emu_test.sh

  # Android VPN e2e — spike (TUN/apply-revert/reclaim) + a live host-only
  # relay link between the host (listener) and a rooted emulator guest
  # (connector), plus the D-A4/D-A6/D-A9 CLI guard negatives. Independent
  # job (no needs/if gating), mirrors android-emu-e2e's placement/style.
  # Phase 4 of docs/plans/plan_AndroidSupport.
  android-vpn-e2e:
    name: Android VPN e2e (api 30, x86_64)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    env:
      ANDROID_API: "24" # must match Justfile's android_api
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Enable KVM for the hosted emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build host binary (--features vpn)
        run: cargo build --release --features vpn

      - name: Build Android binary + spike example (x86_64, via cargo-ndk)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          cargo ndk -t x86_64 -P "$ANDROID_API" build --release --features vpn
          cargo ndk -t x86_64 -P "$ANDROID_API" build --release --features vpn --example android_vpn_spike

      - name: Run emulator + VPN e2e (T-AND-S1..S3, T-AND-L1..L5)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          script: >-
            BORE_HOST_BIN=$PWD/target/release/bore
            BORE_ANDROID_BIN=$PWD/target/x86_64-linux-android/release/bore
            BORE_SPIKE_BIN=$PWD/target/x86_64-linux-android/release/examples/android_vpn_spike
            ./scripts/android_vpn_test.sh

  # The workflow files are code, and until now nothing checked them. A broken
  # one is invisible until the event that triggers it fires — for `release.yml`
  # that event is a version tag, i.e. the least recoverable moment available.
  # actionlint parses every workflow, type-checks the `${{ }}` expressions
  # against the real context schemas, refuses a `needs:` naming a job that does
  # not exist (red-checked) and runs shellcheck over every `run:` block.
  #
  # It earns its place on evidence, not on principle: its first run on this
  # repository reported that `mean_bean_ci`'s macOS job still used
  # `actions-rs/toolchain@v1` and `actions-rs/cargo@v1`, whose runner "is too
  # old to run on GitHub Actions" — an archived action heading for a hard
  # failure, in the job that gates two of the shipped Darwin targets. Note the
  # limit too: it does NOT check what a reusable workflow does with the inputs
  # it is given, so a called workflow stays as honest as its own tests.
  workflows:
    name: Workflow lint (actionlint)
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `go install`, not `taiki-e/install-action`: actionlint is a Go program
      # and has no crates.io crate, so install-action does not carry it and
      # falls back to cargo-binstall, which fails with `For crate actionlint:
      # actionlint is not found` and exit code 76 (measured, run 34771148278).
      # The version is PINNED and the Go checksum database verifies the module,
      # so this step cannot silently start linting with different rules.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
      - run: actionlint -no-color -oneline

  audit:
    name: Security audit
    if: inputs.only != 'web-transfer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # RUSTSEC-2023-0071 (Marvin Attack, rsa crate, no fixed upgrade available):
      # pulled in transitively by russh's `rsa` feature (ssh-gateway), used only
      # for SSH pubkey/hostkey signing and verification — the advisory's timing
      # side-channel is in PKCS#1v1.5 *decryption*, an operation SSH never
      # performs with RSA (SSH only signs/verifies with it). Not exploitable here.
      - run: cargo audit --ignore RUSTSEC-2023-0071
