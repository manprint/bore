[workspace]
members = [".", "crates/bore-wintun", "crates/bore-android-tun"]

[package]
name = "bore-cli"
version = "1.0.0"
authors = [
    "Fabio Pierri <fabio.pierri@synclab.it>",
    "Eric Zhang <ekzhang1@gmail.com> (original bore)",
]
license = "MIT"
description = "A modern, simple TCP tunnel in Rust that exposes local ports to a remote server, bypassing standard NAT connection firewalls. Fork adding UDP hole-punching (QUIC), secret tunnels, and NAT diagnostics."
repository = "https://github.com/manprint/bore"
keywords = ["network", "cli", "tunnel", "tcp"]
categories = ["network-programming", "web-programming", "command-line-utilities"]
readme = "README.md"
edition = "2021"

[[bin]]
name = "bore"
path = "src/main.rs"

[[example]]
name = "macos_vpn_spike"
required-features = ["vpn"]

[[example]]
name = "android_vpn_spike"
required-features = ["vpn"]

[[example]]
name = "windows_vpn_spike"
required-features = ["vpn"]

[features]
default = ["udp"]
# Direct peer-to-peer secret tunnels via UDP hole-punching + STUN, carried over
# QUIC, with automatic fallback to the server relay. On by default; pulls `quinn`
# (and `quinn-udp`). Build with `--no-default-features` to drop it (e.g. for a
# target where `quinn` does not compile).
udp = ["dep:quinn", "dep:rcgen", "dep:igd-next"]
vpn = ["udp", "dep:tun-rs", "dep:bore-wintun", "dep:bore-android-tun"]
# Embedded SSH ingress (russh) letting a stock OpenSSH client create public,
# vhost and secret tunnels via `ssh -R`/`-L`. Off by default; see docs/SSH_GATEWAY.md.
ssh-gateway = ["dep:russh", "dep:argon2", "dep:password-hash", "dep:ssh-key", "dep:rand"]

[dependencies]
anyhow = { version = "1.0.56", features = ["backtrace"] }
bytes = "1"
clap = { version = "4.5.0", features = ["derive", "env"] }
dashmap = "5.2.0"
fastrand = "2"
futures-util = { version = "0.3.21", features = ["sink"] }
hex = "0.4.3"
hmac = "0.12.1"
# CSPRNG for the direct-path session nonce and STUN transaction id. `ring` is
# already compiled (tokio-rustls/quinn ring provider), so this adds no build cost.
ring = "0.17"
serde = { version = "1.0.136", features = ["derive"] }
serde_json = "1.0.79"
serde_yaml = "0.9"
sha2 = "0.10.2"
socket2 = "0.6.4"
blake3 = "1.5.5"
httparse = "1.8"
tokio = { version = "1.41.0", features = ["fs", "rt-multi-thread", "io-std", "io-util", "macros", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = { version = "0.7.1", features = ["codec", "compat"] }
tracing = "0.1.32"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
uuid = { version = "1.2.1", features = ["serde", "v4"] }
webpki-roots = "1.0.7"
yamux = "0.13.10"
x509-parser = "0.16"
# `time` is already pulled transitively by x509-parser/rustls; named directly here
# to format certificate validity timestamps (RFC3339) without a separate dep.
time = { version = "0.3", features = ["formatting", "local-offset"] }

# Optional, enabled by the `udp` feature (see [features]). These must stay in the
# top-level dependency set so `--all-features` keeps working on Windows too.
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"], optional = true }
rcgen = { version = "0.14.8", optional = true }
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"], optional = true }

# Optional, enabled by the `ssh-gateway` feature (see [features]). `russh` defaults
# to the aws-lc-rs crypto backend; disabled here in favor of `ring` so the binary
# links exactly one crypto backend (tokio-rustls/quinn already use ring).
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"], optional = true }
argon2 = { version = "0.5", optional = true }
# Pulled in transitively by argon2, but pinned here directly to turn on its
# "getrandom" feature (OsRng for salt generation in `hash_password`) — argon2's
# own feature set has no passthrough for it.
password-hash = { version = "0.5", optional = true, features = ["getrandom"] }
# Pulled in transitively by russh, but pinned here directly (exact-pinned to
# match russh's own `=0.7.0-rc.11` requirement) to turn on its "rand_core"
# feature — needed for `PrivateKey::random` (ed25519 host-key auto-gen, D9).
# russh's own feature set has no passthrough for it.
ssh-key = { version = "=0.7.0-rc.11", optional = true, features = ["rand_core"] }
rand = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29.0", features = ["fs", "user", "socket"] }

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

# TUN device backend. Linux uses GSO/GRO offload + multi-queue through tun-rs;
# macOS uses the basic utun path through tun-rs. Windows uses WinTun bindings and
# loads wintun.dll at runtime.
[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "android"))'.dependencies]
tun-rs = { version = "2.8.5", optional = true, features = ["async"] }

[target.'cfg(windows)'.dependencies]
bore-wintun = { path = "crates/bore-wintun", optional = true }
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }

[target.'cfg(target_os = "android")'.dependencies]
bore-android-tun = { path = "crates/bore-android-tun", optional = true }

[dev-dependencies]
lazy_static = "1.4.0"
rcgen = "0.14.8"
rstest = "0.15.0"
tempfile = "3"
tokio = { version = "1.41.0", features = ["sync", "test-util", "process"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Vendored russh 0.62.1 carrying an UNMERGED upstream fix (Eugeny/russh#730,
# "gate WINDOW_ADJUST on consumption to fix per-channel HOL blocking"). Stock
# russh forwards inbound CHANNEL_DATA to the per-channel mpsc with a blocking
# `chan.send().await` inside the single session read loop, and replenishes the
# SSH receive window on RECEIPT. One slow/paused consumer (e.g. a browser
# buffering a video over an `ssh -R` public/vhost tunnel) fills its mpsc and
# parks the whole connection — every OTHER channel starves until it drains.
# The vendored copy replaces the blocking send with a bounded per-channel
# backlog (`try_send` + queue on Full) and withholds WINDOW_ADJUST until the
# application actually consumes, so a stalled channel drains its own window to
# zero and its peer throttles while the loop stays live for every other
# channel. See crates/russh/HOL_FIX.md.
[patch.crates-io]
russh = { path = "crates/russh" }
