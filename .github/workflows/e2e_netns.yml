name: E2E (netns)

# End-to-end network-namespace test + benchmark scripts under scripts/.
# These need root (netns / nftables / iptables / TUN), which GitHub-hosted
# ubuntu runners provide via passwordless sudo on a full VM (NOT a container —
# container jobs can't create netns/TUN without --privileged, which Actions
# does not expose). No Docker required.
#
# NON-BLOCKING ON A BRANCH, BLOCKING FOR A RELEASE. On an ordinary push the
# matrix job is `continue-on-error: true` and `fail-fast: false`, so any script
# failing/timing out is surfaced (failed matrix leg + uploaded log) without
# failing the workflow or blocking a PR. Called with `gate: true` (only
# `release.yml` does), the CORRECTNESS scripts become blocking and a failure
# stops the release.
#
# WHY THAT IS SAFE, AND WHY IT IS ONLY THE CORRECTNESS SCRIPTS. Measured before
# the switch was made, not assumed: the last four completed runs on `main`
# (ed50a40, 6d7b6bd, a883391, 3115987) were 15/15 green in every one, so making
# this suite decide a release is not a flakiness gamble. The BENCH and DEBUG
# legs stay non-blocking even under `gate`, because a bench on a shared CI VM
# measures the VM -- it has no pass threshold to fail against, and a noisy
# neighbour must never be the reason a release does not ship. `matrix.gate`
# is the per-script switch; it is deliberately DATA in the matrix rather than a
# name pattern, so adding a script forces a decision about which kind it is.
#
# Each script runs in its OWN matrix job (own runner, own netns, own timeout):
# one hung script can never consume another's budget or cancel the whole run —
# the bug that cancelled the earlier single-job version at the 60 m ceiling.

on:
  push:
    branches: ["**"] # every branch: run all netns e2e on any push (non-blocking)
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      gate:
        description: "Make the correctness scripts blocking (release gate)."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build bore (release, vpn)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `--features vpn,ssh-gateway` is additive (keeps default `udp`); the
      # one binary drives every script (vpn/vhost/secret/local/admin/ssh_gateway).
      - run: cargo build --release --features vpn,ssh-gateway
      - uses: actions/upload-artifact@v4
        with:
          name: bore-bin
          path: target/release/bore
          retention-days: 1

  e2e:
    name: ${{ matrix.script }}
    needs: build
    runs-on: ubuntu-latest
    # `inputs.gate` is unset (falsy) for push/PR/dispatch, so an ordinary run is
    # byte-for-byte the old behaviour: every leg non-blocking. Only a leg that
    # is BOTH a correctness script and part of a gated call can fail the run.
    continue-on-error: ${{ !(inputs.gate && matrix.gate) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # e2e netns tests -- correctness, so `gate: true`
          - { script: admin_dashboard_test,      secs: 600,  gate: true }
          - { script: local_proxy_netns_test,    secs: 900,  gate: true }
          - { script: secret_netns_test,         secs: 1200, gate: true }
          - { script: vhost_netns_test,          secs: 1200, gate: true }
          - { script: vhost_netns_test_hard,     secs: 1200, gate: true }
          - { script: ssh_gateway_test,          secs: 1200, gate: true }
          # regression gate for the carriers=1 vhost/local --udp connection-window
          # stall (R3: a fast request must complete <3 s while slow readers pin
          # the shared QUIC connection window). Guards commit 04aac76.
          - { script: vhost_udp_concurrency_repro, secs: 600, gate: true }
          - { script: vpn_netns_test,            secs: 1500, gate: true }
          - { script: vpn_netns_test_hard,       secs: 1500, gate: true }
          # benchmarks (noisy on shared CI VMs; smoke signal only) -- never a gate
          - { script: local_bench,               secs: 900,  gate: false }
          - { script: vhost_bench,                secs: 900,  gate: false }
          - { script: vpn_bench,                  secs: 900,  gate: false }
          # debug scenarios (fixed scenario, then exit) -- never a gate
          - { script: vhost_debug,                secs: 300,  gate: false }
          - { script: vpn_debug,                  secs: 300,  gate: false }
          # teardown helper -- never a gate
          - { script: vhost_cleanup,              secs: 120,  gate: false }
    steps:
      - uses: actions/checkout@v4

      - name: Download bore binary
        uses: actions/download-artifact@v4
        with:
          name: bore-bin
          path: target/release

      - name: Prepare binary + tooling
        run: |
          # Artifacts lose the exec bit; restore it. `touch` keeps the binary
          # newer than src/ so the netns harness staleness guard passes.
          chmod +x target/release/bore
          touch target/release/bore
          chmod +x scripts/*.sh
          # socat / iperf3 are required by the netns tests (else they SKIP);
          # wrk is an optional load generator for the bench scripts (they fall
          # back to timeout-guarded curl loops when absent). openssh-client
          # ships preinstalled on the ubuntu-latest image; autossh/sshpass do
          # not, and ssh_gateway_test.sh's T-SSH-N2/N6 skip (not fail) without
          # them, so the install failing softly here just narrows coverage,
          # never breaks the run.
          sudo apt-get update -qq
          sudo apt-get install -y -qq socat iperf3
          sudo apt-get install -y -qq wrk || true
          sudo apt-get install -y -qq autossh sshpass || true
          test -c /dev/net/tun || sudo modprobe tun
          sudo modprobe nf_tables || true

      - name: Run ${{ matrix.script }}
        # Hard wall-clock cap per script: SIGTERM at `secs` (lets the script's
        # EXIT trap clean up its netns/nft state), then SIGKILL 60 s later.
        # `timeout` runs under sudo (as root) so it can signal root-spawned
        # children. The step's own 30 m timeout-minutes is a backstop.
        run: |
          sudo -n timeout --kill-after=60 ${{ matrix.secs }} \
            "$GITHUB_WORKSPACE/scripts/${{ matrix.script }}.sh" \
            2>&1 | tee "e2e-${{ matrix.script }}.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log-${{ matrix.script }}
          path: e2e-${{ matrix.script }}.log
          if-no-files-found: ignore
          retention-days: 14
