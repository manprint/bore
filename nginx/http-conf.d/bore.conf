# HTTP side of the bore deployment. Install inside nginx's `http {}` context,
# normally as /etc/nginx/conf.d/bore.conf.

map $http_upgrade $bore_connection_upgrade {
    default upgrade;
    ""      "";
}

upstream bore_vhost_http {
    server 127.0.0.1:8080;
    keepalive 32;
}

# The control/admin and browser-transfer hosts are HTTPS-only. Keep the ACME
# location only if the base certificate is renewed with HTTP-01.
server {
    listen 80;
    listen [::]:80;
    server_name bore.example.com files.bore.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

# Plain HTTP for dynamic vhosts. bore itself applies each provider's
# --https=off|on|redirect policy; terminating that policy here would make every
# subdomain behave identically.
server {
    listen 80;
    listen [::]:80;
    server_name *.bore.example.com;

    location / {
        proxy_pass http://bore_vhost_http;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bore_connection_upgrade;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
