# bore server — bridge network with explicit port forwarding.
#
#   docker compose -f docker-compose.server.yml up -d
#
# The image defaults to $BORE_IMAGE (see the justfile `repo`); override with
#   BORE_IMAGE=youruser/bore:latest docker compose ... up -d
#
# Performance / UDP notes: see ../SERVER_UDP_OPTIMIZATION.md.

networks:
  bore:
    driver: bridge

services:
  bore-server:
    image: ${BORE_IMAGE:-yourusername/bore:latest}
    # To build locally instead of pulling, comment `image:` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: bore-server
    command: ["server"]
    restart: unless-stopped

    # Default: Docker bridge network. This keeps Docker isolation and requires
    # explicit `ports:` below. For public STUN/UDP deployments, bridge NAT can
    # sometimes hide details of the client's real UDP source address. If paired
    # `bore test-udp` always falls back to relay despite reachable UDP, try host
    # networking on Linux.
    #
    # Host networking alternative:
    #   1. Uncomment `network_mode: host`.
    #   2. Comment out `networks:` and the whole `ports:` block below.
    #   3. Open BORE_CONTROL_PORT/tcp, BORE_CONTROL_PORT/udp, and the tunnel
    #      range on the host firewall / cloud security group.
    #
    # Trade-off: host networking is usually best for STUN correctness and lowest
    # overhead, but it shares the host network namespace and gives less Docker
    # isolation. It is primarily a Linux production option.
    # network_mode: host
    networks:
      - bore

    # Raise this when BORE_MAX_CONNS / BORE_MAX_CARRIERS are increased. Each
    # relayed connection and carrier consumes file descriptors; too low a limit
    # causes accept/connect failures under load. The host/Docker daemon must also
    # allow the requested value.
    # ulimits:
    #   nofile:
    #     soft: 1048576
    #     hard: 1048576

    # The control port and the tunnel port range must be forwarded explicitly,
    # and MUST match BORE_CONTROL_PORT and BORE_MIN_PORT/BORE_MAX_PORT below.
    ports:
      # Kept exposed even with a BORE_SSH_GATEWAY demux on the port(s) below —
      # native bore clients (no --to scheme change needed) keep working exactly
      # as before; SSH is additive, not a replacement.
      - "7835:7835"            # control port (TCP)
      - "7835:7835/udp"        # STUN responder fallback (UDP) for BORE_UDP direct paths
      - "6000-7000:6000-7000"  # tunnel port range
      # Optionally expose the control port on a standard web port. The scheme is
      # decided by the certificate, not the port. With BORE_SSH_GATEWAY enabled
      # and no BORE_SSH_PORT, SSH is demuxed onto this SAME port too — one port
      # serves TLS/HTTP/native-bore/SSH concurrently (docs/SSH_GATEWAY.md):
      # - "80:7835"            # plain HTTP (no cert/key set) -> clients use http://bore.tld
      # - "443:7835"           # HTTPS (set BORE_CERT_FILE/BORE_KEY_FILE) -> clients use https://bore.tld
      #
      # --- vhost frontend (subdomain reverse proxy) ---
      # Two deployment topologies (pick ONE):
      #
      # A) Unified single port (recommended, one public IP). Expose the control port
      #    on 443 (the "443:7835" line above). When vhost is enabled, that one port
      #    serves everything: bore-protocol tunnels, the admin page, AND vhost — an
      #    HTTPS request whose Host is <sub>.<base-domain> is routed to that provider.
      #    Requirement: BORE_CERT_FILE must be a WILDCARD cert covering
      #    *.<base-domain> (and the apex). No extra ports needed; do NOT also publish
      #    80:80 / 443:443 below. Clients keep using the default https://<base-domain>.
      #
      # B) Dedicated frontend ports. Keep the control port on 7835 only (clients use
      #    --to <host>:7835) and publish the standalone vhost listeners here. Use this
      #    when 443 must stay reserved for the bore protocol, or for plain HTTP on 80:
      # - "80:80"              # vhost HTTP frontend  (BORE_VHOST_HTTP_PORT)
      # - "80:80/udp"          # vhost QUIC default when running HTTP-only / no cert
      # - "443:443"            # vhost HTTPS frontend (BORE_VHOST_HTTPS_PORT, needs cert)
      # - "443:443/udp"        # vhost QUIC direct path (BORE_VHOST_QUIC_PORT; extra firewall rule)
    environment:
      - BORE_SECRET=change-me
      - BORE_CONTROL_PORT=7835
      - BORE_MIN_PORT=6000
      - BORE_MAX_PORT=7000
      # Max concurrently proxied connections through the server relay/public
      # data path. Raising it allows more load, but requires CPU, RAM and enough
      # file descriptors (`ulimits.nofile`). It does NOT increase direct UDP
      # bandwidth: successful UDP direct data bypasses the server.
      - BORE_MAX_CONNS=1024
      # Cap on parallel TCP "carrier" connections for public tunnels and secret/
      # vhost providers using --carriers. Helps concurrent relay workloads, not
      # single bulk flows. Higher values mean more sockets and scheduler work; 1
      # disables server-side pools. NOTE: this caps only the TCP relay pools — the
      # vhost `--udp` QUIC direct pool is provider-driven and bounded separately
      # (32 connections per subdomain), not by this value.
      # CAVEAT: it also divides BORE_UDP_MEMORY_BUDGET below. A very large value
      # (1024, say) drives the derived per-connection window to its 16MiB floor
      # for any practical budget. 16 is the built-in default and keeps the
      # budget's window arithmetic meaningful.
      - BORE_MAX_CARRIERS=16
      # Per-direction proxy copy buffer for the relay/splice data path (public,
      # secret, and vhost). Default 256KiB, tuned for large files on high-latency
      # links; accepts a KB/MB/GB/KiB/MiB/GiB suffix, clamped to [4KiB, 16MiB].
      # Memory cost ~= size x 2 directions x concurrent connections. It does NOT
      # raise single-stream throughput on a low-latency link. The same var is read
      # by client/provider processes for their local splice (see the client
      # compose). Uncomment to override the 256KiB default.
      # MEASURED 2026-09-11 (staging, A/B/A over a 40 ms path, which is where a
      # copy buffer should bite): 128KiB -> 25.57 MB/s, 256KiB -> 28.53,
      # 128KiB again -> 29.67. The two identical arms differ by 16 %, so the
      # parameter has no effect larger than the drift of the path. Leave it
      # UNSET unless you have measured your own path; do NOT set it small.
      # - BORE_PROXY_BUFFER_SIZE=1MiB
      #
      # Direct-UDP tuning defaults. These are EXACTLY the built-in values
      # (src/shared.rs DIRECT_QUIC_*), repeated here for visibility. Leaving them
      # commented is identical to setting them and is preferred, so a future
      # change to the tested defaults is picked up automatically.
      #
      # CRITICAL RATIO: connection_receive_window must stay >> stream_receive_window
      # (256MiB : 16MiB = 16:1). At --carriers 1 every proxied connection is a bidi
      # stream on ONE QUIC connection, and a slow public reader lets quinn buffer a
      # full 16MiB stream window against the SHARED connection window. conn/stream is
      # therefore how many stalled streams starve every other stream: 64MiB gave ~4
      # and produced the vhost "asset stuck pending" stall (docs/VHOST_UDP_CONCURRENCY_FIX.md);
      # 256MiB tolerates ~16. Do NOT lower the connection window toward the stream
      # window, and do NOT raise the stream window to meet it (that costs
      # single-stream throughput).
      # - BORE_UDP_STREAM_RECEIVE_WINDOW=16MiB
      # - BORE_UDP_CONNECTION_RECEIVE_WINDOW=256MiB
      # - BORE_UDP_SEND_WINDOW=256MiB
      # - BORE_UDP_SOCKET_RECV_BUFFER=16MiB
      # - BORE_UDP_SOCKET_SEND_BUFFER=16MiB
      # - BORE_UDP_MAX_STREAMS=4096
      #
      # RECOMMENDED for any server that exposes --udp to untrusted providers:
      # a server-wide ceiling on the memory the direct UDP path may commit.
      # Without it, tunnels x carriers x connection_receive_window is unbounded.
      # MEASURED 2026-09-11: with 48 slow readers on ONE --udp tunnel, the server
      # process peaked at 340.4 MiB without it and 42.2 MiB with it, on a 903 MiB
      # host, and kept serving instead of starving. Throughput cost measured from a
      # domestic consumer on the QUIC direct path (the one place the derived window
      # can bind): ON 53.16/56.25 MB/s vs OFF 52.28/49.72 MB/s -- i.e. none.
      # A connection refused by the budget silently stays on the warm TCP relay and
      # increments `direct_budget_refusals` on /admin/api/v1/metrics; it is never a
      # failed request.
      # CONFLICTS with the three window variables above (the server refuses to start
      # if both are set). It derives them instead:
      #   conn = clamp(budget / BORE_MAX_CARRIERS, 16MiB, 256MiB), stream = conn/16,
      #   slots = budget / conn
      # so a LARGE BORE_MAX_CARRIERS collapses the windows to the 16MiB/1MiB floor and
      # the budget then buys only admission slots. Read back the resolved values as
      # udp_stream_receive_window / udp_connection_receive_window / udp_direct_slots
      # on GET /admin/api/v1/config.
      # - BORE_UDP_MEMORY_BUDGET=512MiB
      #
      # Direct-path QUIC liveness. Unset = the shipped pair (3000 / 10000), which is
      # what every published measurement assumes. The idle timeout is ALSO the width
      # of the window in which a request already committed to a direct stream is lost
      # when UDP stops working: with the peer silent, opening the stream and writing
      # STREAM_READY both succeed locally, so the request can only wait for the
      # connection to be declared dead. MEASURED: the loss window equals the idle
      # timeout to the millisecond, and every later request is served on the warm
      # relay in ~12 ms. QUIC negotiates the MINIMUM of the two peers' idle timeouts,
      # so setting it here alone is enough -- providers need no change.
      # 4000 ms was measured safe to at least 30 % packet loss and cuts the worst case
      # from 10 s to 4 s. The resolver keeps two consecutive keep-alive losses
      # survivable (max_idle >= 3 x keepalive) by TIGHTENING the keep-alive, and warns
      # when it does. Regression gate: scripts/perf/vhost_idle_window.sh
      # - BORE_DIRECT_QUIC_IDLE_MS=4000
      # - BORE_DIRECT_QUIC_KEEPALIVE_MS=1000
      # Broker UDP hole-punched direct paths for secret tunnels and run a STUN
      # responder on the control port (UDP). Clients try public STUN first
      # (Cloudflare/Google) and use this 7835/udp responder as the self-hosted
      # fallback. The direct data path is peer-to-peer and does NOT traverse this
      # container; only STUN/brokering + control do.
      - BORE_UDP=true
      # NAT caveat: behind docker's bridge, the STUN responder must see each
      # client's real source address. If reflexive discovery misbehaves (clients
      # always fall back to relay), run the server with `network_mode: host`
      # instead of bridge, or point clients at an external --stun-server.
      # Public domain advertised to clients (enables http(s):// addressing):
      # - BORE_BIND_DOMAIN=bore.tld
      # Enable the read-only admin status page at /admin/status on the control
      # port (min 32 chars). It is served over the same scheme as the control
      # connection (http or https). Leave unset to disable the page entirely.
      # - BORE_ADMIN_TOKEN=change-me-to-a-long-random-token-32+chars
      # HSTS for HTTPS control-port HTTP responses (admin page and control-port
      # 404/vhost-miss responses). Default is already
      # `max-age=31536000; includeSubDomains`; set `off` to disable.
      # - BORE_CONTROL_HSTS=max-age=31536000; includeSubDomains
      # Serve the control connection over TLS (also used for --https tunnels);
      # mount the files via the `volumes:` block below.
      # - BORE_CERT_FILE=/certs/cert.pem
      # - BORE_KEY_FILE=/certs/key.pem
      #
      # --- vhost frontend (subdomain-routed reverse proxy) ---
      # Enable by setting a base domain (no config file required). Clients then run:
      #   bore vhost 127.0.0.1:8080 --subdomain app --id myid --to <this-server>
      #   -> http(s)://app.<base-domain>
      # DNS: point a wildcard *.<base-domain> at this host. Also publish the vhost
      # frontend ports in the `ports:` block above. See ../docs/VHOST.md.
      # - BORE_VHOST_BASE_DOMAIN=bore.mydomain.com
      # Frontend mode: http | https | both | redirect-https | auto. Default auto =
      # http when no cert, both when a cert is present.
      # - BORE_VHOST_MODE=auto
      # Frontend ports (must match the published vhost `ports:` above).
      # - BORE_VHOST_HTTP_PORT=80
      # - BORE_VHOST_HTTPS_PORT=443
      # UDP port for the vhost QUIC direct path (`bore vhost --udp`). Default =
      # the active vhost frontend port on UDP: HTTP when running without TLS,
      # HTTPS when the resolved mode serves HTTPS. Distinct from BORE_CONTROL_PORT/udp.
      # Open it in the host/cloud firewall separately from 7835/udp.
      # - BORE_VHOST_QUIC_PORT=443
      # Wildcard TLS cert/key for *.<base-domain> (required for https/both/redirect-https
      # modes). Mount them via the `volumes:` block below.
      # - BORE_VHOST_CERT_FILE=/certs/vhost-fullchain.pem
      # - BORE_VHOST_KEY_FILE=/certs/vhost-privkey.pem
      # Advanced only: static subdomain reservations plus default request/response
      # header injection need a yaml file (everything above is env-configurable without one). Mount
      # it and set the path here; base-domain/ports/mode/cert env vars still override
      # the file. The file is hot-reloaded on change.
      # - BORE_VHOST_CONFIG=/vhost/vhost.yml
      #
      # --- SSH ingress gateway (stock `ssh -R`/`-L`, no bore client needed) ---
      # Lets a plain OpenSSH client create public/vhost/secret tunnels. With no
      # BORE_SSH_PORT, SSH is demuxed onto the control port itself (the SAME
      # 443:7835/80:7835/7835:7835 mapping above already carries it — SSH shares
      # that port with TLS/HTTP/native bore automatically; see docs/SSH_GATEWAY.md).
      # Set BORE_SSH_PORT only if you want SSH on its OWN dedicated port instead/
      # as well (publish it in `ports:` too). Requires at least one credential
      # source (authorized-keys dir and/or a password file generated with
      # `bore hash-password`); mount them via the `volumes:` block below.
      # - BORE_SSH_GATEWAY=true
      # - BORE_SSH_HOST_KEY_FILE=/etc/bore/ssh/host_key.pem
      # - BORE_SSH_AUTHORIZED_KEYS_DIR=/etc/bore/ssh/authorized_keys.d
      # - BORE_SSH_PASSWORDS_FILE=/etc/bore/ssh/passwords
      # - BORE_SSH_PORT=2222
    # volumes:
    #   - ./certs:/certs:ro
    #   - ./vhost:/vhost:ro
    #   # NOT :ro — the host key is generated here on first run if it doesn't
    #   # exist yet; a read-only mount would make that fail.
    #   - ./ssh:/etc/bore/ssh
