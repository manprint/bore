# Self-contained syntax-test harness; it is not a production configuration.
worker_processes 1;
error_log stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    include /work/nginx/http-conf.d/*.conf;

    # Represents all HTTPS virtual hosts that production moves off public 443.
    server {
        listen 127.0.0.1:8443;
        server_name existing.example.com;
        return 204;
    }
}

stream {
    include /work/nginx/stream-conf.d/*.conf;
}
