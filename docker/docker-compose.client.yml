# bore client (`bore local`) — host network.
#
#   docker compose -f docker-compose.client.yml up -d
#
# Host networking lets the client reach services on the host's localhost and
# avoids per-port forwarding.

services:
  bore-client:
    image: ${BORE_IMAGE:-yourusername/bore:latest}
    # With --udp / BORE_PREFER_UDP use the ROOT image and grant NET_ADMIN:
    #   image: ghcr.io/manprint/bore:client
    #   privileged: true            # or: cap_add: [NET_ADMIN]
    # Docker clears every capability for a non-root UID (even under privileged),
    # so the default uid-1000 image cannot call SO_*BUFFORCE and the direct UDP
    # path stays clamped to net.core.{r,w}mem_max (WARN on every socket).
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: bore-client
    command: ["local"]
    # --port and --local-host have no env vars; set them in the command instead:
    # command: ["local", "--port", "9000", "--local-host", "127.0.0.1"]
    #
    # Expose the local service as a Host-routed subdomain instead (the server must
    # run with a vhost frontend; see docker-compose.server.yml + ../docs/VHOST.md).
    # The target is a positional arg; --subdomain/--id also read BORE_VHOST_SUBDOMAIN
    # / BORE_VHOST_ID. Reachable at http(s)://<subdomain>.<server-base-domain>:
    # command: ["vhost", "127.0.0.1:8080", "--subdomain", "app", "--id", "my-client"]
    # To also try the QUIC direct path for the server->provider hop, add --udp and
    # publish/open BORE_VHOST_QUIC_PORT/udp on the server. Without TLS this often
    # means publishing 80/udp alongside the HTTP frontend:
    # command: ["vhost", "127.0.0.1:8080", "--subdomain", "app", "--id", "my-client", "--udp"]
    restart: unless-stopped
    network_mode: host
    environment:
      - BORE_SERVER=bore.tld          # --to; may be http(s)://bore.tld[:port]
      - BORE_LOCAL_PORT=8080          # local service port to expose
      - BORE_SECRET=change-me
      - BORE_AUTO_RECONNECT=true
      # Register as a named secret tunnel (no public port; reach via bore proxy):
      # - BORE_TCP_SECRET_ID=my-service
      # Prefer a direct UDP path instead of the TCP relay. Falls back to the
      # relay if it cannot be established. Requires the server to run with
      # BORE_UDP=true. TWO different mechanisms share this one flag:
      #   * with BORE_TCP_SECRET_ID (secret-tunnel provider): UDP hole-punch to
      #     the consumer;
      #   * on a PUBLIC-port tunnel (`bore local`, no secret id): server->client
      #     QUIC direct to the server's BORE_VHOST_QUIC_PORT, no hole-punch.
      #     It is NOT ignored here -- it used to be, before the public `--udp`
      #     path existed, and this comment said so.
      #
      # MEASURED RECOMMENDATION for a PUBLIC tunnel (staging campaign
      # 2026-09-11, docs/performance/PUBLIC_STAGING_EVIDENCE_2026-09-11.md):
      # leave it OFF unless you have one of the two problems it solves. On a
      # clean in-region path the TCP relay beat QUIC direct in every one of ten
      # paired runs -- median 1.51x on download and 1.34x on upload -- and it
      # also won the p95/p99 of a small-request latency probe
      # (6.23/8.77 ms relay against 10.76/17.79 ms direct).
      # Turn it ON when:
      #   * many connections are held open at once -- at 32 concurrent HTTP
      #     connections the direct path won the tail (p95 3.48 vs 4.58 ms,
      #     p99 3.96 vs 7.27 ms);
      #   * the path is lossy -- the direct path is the one that keeps serving.
      # It is NOT a general throughput upgrade.
      #
      # The THROUGHPUT half of that recommendation is PROVISIONAL: every paired
      # run above was measured against a server carrying P-13 (the shared QUIC
      # endpoint ran on an untuned 208 KiB receive buffer, which is the
      # RECEIVING side of a download). Re-measure on a server built from this
      # commit before relying on the ratios. The latency, concurrency and loss
      # results stand -- none of them is bandwidth-bound.
      # - BORE_PREFER_UDP=true
      # STUN server for UDP candidate discovery; defaults to the bore server's
      # control endpoint. Override only if the server is not also the STUN server:
      # - BORE_STUN_SERVER=stun.l.google.com:19302
      # Bind the UDP hole-punch socket to a fixed port (0=random). Open it for
      # egress in a strict firewall, same value on both peers, for the direct path:
      # - BORE_NAT_UDP_PORT=41641
      # Terminate TLS on the tunnel port (the server must have a certificate):
      # - BORE_HTTPS=true
      # Redirect plain HTTP on the tunnel port to https:// (requires BORE_HTTPS):
      # - BORE_FORCE_HTTPS=true
      # Protect the tunnel with HTTP Basic auth ("user:pass"). For a public tunnel
      # the server enforces it; for a secret tunnel this provider enforces it. Use
      # over TLS so credentials are not sent in the clear.
      # - BORE_BASIC_AUTH=admin:s3cr3t
      # Vhost direct-QUIC path (server->provider hop only). Ignored unless the
      # command is `bore vhost ...` and the server has BORE_UDP=true plus an open
      # BORE_VHOST_QUIC_PORT/udp.
      #
      # MEASURED RECOMMENDATION: leave it OFF for an ordinary web app or file
      # server. On the staging campaign the TCP relay was faster on small requests
      # (93.93 vs 103.74 ms p50 through a real file server), equal or better on
      # sustained bulk, about half the CPU per GiB (6.85 vs 13.00 core-seconds), and
      # far cheaper in cloud instance network allowance (the direct path generated
      # 36x more inbound-allowance misses for the same delivered bytes).
      # Turn it ON for the two cases where the relay cannot compete:
      #   * very many simultaneously held connections -- a fresh request behind 512
      #     held connections took 14 ms direct against 1436 ms through the relay;
      #   * lossy paths -- 2.7x faster under injected packet loss.
      # It is NOT a general throughput upgrade.
      # - BORE_VHOST_UDP=true
      # Label this tunnel on the server's admin status page:
      # - BORE_NOTES=dev box A
      # Open N parallel carrier connections for the data path and spread proxied
      # connections across them (round-robin), avoiding yamux's single-connection
      # head-of-line blocking under concurrency (e.g. parallel rclone/S3 transfers,
      # many web requests). Works for a public tunnel (server->client leg) and a
      # secret provider (server->provider leg); the server clamps it to
      # BORE_MAX_CARRIERS. 1 = single connection.
      # For `bore vhost --udp` it ALSO sizes the QUIC direct path: N parallel QUIC
      # connections, pooled and round-robined by the server (capped at 32/subdomain,
      # NOT by BORE_MAX_CARRIERS). For secret/transfer the UDP direct path already
      # uses independent native QUIC streams, so carriers apply only to the relay.
      # A single bulk flow rides one connection regardless of N.
      #
      # MEASURED RECOMMENDATION (staging campaign 2026-09-11, see
      # docs/performance/VHOST_STAGING_EVIDENCE_2026-09-10_DEV_RESULT.md §8.1).
      # There is no single best value; pick by workload:
      #   one big transfer at a time      -> BORE_CARRIERS=1  (the default)
      #        59.10 MB/s down / 93.67 up from a domestic consumer, against
      #        52.55 / 72.17 at 8: splitting one bulk flow across eight carriers
      #        splits the congestion window eight ways.
      #   a web app: small requests
      #   alongside occasional bulk       -> BORE_CARRIERS=8
      #        small-request p95 under one bulk transfer 14.06 -> 4.92 ms, and
      #        393 -> 1162 requests/s under two. Costs ~11 % of peak single-transfer
      #        bandwidth.
      #   unknown or mixed                -> BORE_CARRIERS=0  (adaptive)
      #        matches static 8 on throughput (median ratio 1.033) while holding one
      #        carrier, and grows only when a small request actually CONTENDS with a
      #        bulk transfer. A pure-bulk tunnel therefore stays at one carrier --
      #        that is by design, not a bug.
      # On a clean idle path carriers still COST a little (median c4/c1 = 0.88), which
      # is why 1 remains the default.
      # - BORE_CARRIERS=4
      # Per-direction copy buffer for this provider's local-service splice. Default
      # 256KiB; KB/MB/GB/KiB/MiB/GiB suffix, clamped [4KiB,16MiB]. Match the server's
      # BORE_PROXY_BUFFER_SIZE for an end-to-end large buffer on high-latency links.
      # - BORE_PROXY_BUFFER_SIZE=1MiB
      # Accept a self-signed server certificate for an https:// control address:
      # - BORE_INSECURE=true
