[package]
name = "bore-alloc"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
build = "build.rs"

# mimalloc only where it pays: the static musl builds (the Docker image and the
# released Linux binaries), whose default allocator (mallocng) is the relay
# bottleneck. glibc, macOS, Windows and Android keep the system allocator, and
# the 32-bit musl targets are left out on purpose (no measurement, and
# mimalloc's 64-bit atomics need libatomic on armv5te).
[target.'cfg(all(target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
mimalloc = { version = "0.1.52", default-features = false }
# Direct dependency so the build script receives DEP_MIMALLOC_INCLUDE_DIR.
libmimalloc-sys = { version = "0.1.49", default-features = false }

[build-dependencies]
cc = "1"
