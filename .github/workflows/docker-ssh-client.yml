# Builds docker/Dockerfile.ssh (the SSH-gateway tunnel client: openssh+autossh+
# sshpass, no bore binary) and pushes it to GHCR as bore-ssh-client.
#
# Unlike docker.yml, no per-arch native-runner split is needed: the image is a
# plain `apk add` on alpine (no Rust compile), so a single QEMU multi-arch job
# is fast and simpler.
name: Docker SSH client (GHCR)

# Same split as docker.yml: branches publish directly, a `v*` tag arrives
# through `release.yml` AFTER the gates. Note the `paths:` filter is a property
# of the PUSH trigger only -- a release must rebuild this image whether or not
# its inputs changed in that commit, because the tag has to name a real image.
on:
  push:
    branches:
      - "**" # every branch, but only when the client image inputs change
    paths:
      - "docker/Dockerfile.ssh"
      - "docker/ssh-entrypoint.sh"
      - ".github/workflows/docker-ssh-client.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

# `github.repository_owner` (manprint) is already lowercase, as GHCR requires;
# if the owner ever has uppercase letters, lowercase it here (same note as docker.yml).
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/bore-ssh-client

jobs:
  build:
    name: Build and push multi-arch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # :latest on every build (client image is branch-independent tooling),
          # plus branch/semver/sha tags for traceability.
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            # `{{raw}}` is the tag exactly as pushed, so it carries the `v`
            # for a PRERELEASE too; `v{{version}}` emits nothing for one.
            # MEASURED on the v1.2.0-rc.1 run -- see the note in docker.yml.
            type=semver,pattern={{raw}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.ssh
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ssh-client
          cache-to: type=gha,mode=max,scope=ssh-client

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:latest
