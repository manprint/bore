# bore server — bridge network with explicit port forwarding.
#
#   docker compose -f docker-compose.server.yml up -d
#
# The image defaults to $BORE_IMAGE (see the justfile `repo`); override with
#   BORE_IMAGE=youruser/bore:latest docker compose ... up -d

networks:
  bore:
    driver: bridge

services:
  bore-server:
    image: ${BORE_IMAGE:-ghcr.io/manprint/bore:dev}
    # To build locally instead of pulling, comment `image:` and uncomment:
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    pull_policy: always
    container_name: bore-server
    command: ["server"]
    restart: always
    networks:
      - bore
    # This deployment binds 80 and 443 (BORE_VHOST_HTTP_PORT / _HTTPS_PORT
    # below) and therefore CANNOT be switched to `network_mode: host` as it
    # stands: the image runs as UID 1000, and
    # `net.ipv4.ip_unprivileged_port_start` is per network namespace — Docker
    # sets it to 0 in the namespace it creates for a bridge container, but host
    # networking shares the host's namespace, where it is 1024. The server then
    # exits with `Error: Permission denied (os error 13)`. Add `user: "0:0"` or
    # lower the host sysctl first; `cap_add: [NET_BIND_SERVICE]` does NOT help.
    # Full measurements in docker-compose.server.yml, step 4.
    # FILE DESCRIPTORS vs BORE_MAX_CONNS (P-12). The --max-conns semaphore
    # promises a GRACEFUL bound: at capacity one connection is dropped,
    # `conn_rejections` increments, every other connection keeps serving. That
    # promise needs one descriptor per admitted connection. Above the descriptor
    # limit the kernel refuses FIRST with EMFILE, and EMFILE lands on accept()
    # for EVERY listener the process owns -- so one tunnel's concurrency takes
    # down the admin API, the vhost frontends and every other tunnel. MEASURED
    # 2026-09-11 (docs/campagna-2026-09-13/evidenze/PUBLIC_STAGING_EVIDENCE_2026-09-11.md
    # section 11): BORE_MAX_CONNS=1024 against a soft RLIMIT_NOFILE of 1024, at
    # ~976 held connections through ONE tunnel, logged `No file descriptors
    # available (os error 24)` every 100 ms and answered nothing on its control
    # port for ~30 s -- while `conn_rejections` stayed 0, because the configured
    # bound was unreachable by construction.
    #
    # The server now RECONCILES this at startup, before it binds its first
    # listener: it raises its own SOFT limit to BORE_MAX_CONNS + 256 whenever
    # the HARD limit allows, and warns with both remedies when the hard limit is
    # itself short. A limit already sufficient is left alone and stays silent.
    # So this block is needed only when the container's HARD limit is below
    # BORE_MAX_CONNS + 256, which the default Docker daemon does not do.
    # Uncomment it if that startup warning ever appears.
    # ulimits:
    #   nofile:
    #     soft: 1048576
    #     hard: 1048576
    # The control port and the tunnel port range must be forwarded explicitly,
    # and MUST match BORE_CONTROL_PORT and BORE_MIN_PORT/BORE_MAX_PORT below.
    ports:
      - "7835:7835"            # control port
      - "7835:7835/udp"        # udp
      - "9000-9100:9000-9100"  # tunnel port range
      - "443:7835"             # expose the control port over standard HTTPS
      - "80:80/udp"            # quic udp
      - "443:443/udp"          # quic udp https 
    environment:
      - BORE_SECRET=zzzzzzzzzzzzzzzzzzzzzz
      - BORE_CONTROL_PORT=7835
      - BORE_MIN_PORT=9000
      - BORE_MAX_PORT=9100
      - BORE_MAX_CONNS=1024
      # Public domain advertised to clients (enables http(s):// addressing):
      - BORE_BIND_DOMAIN=bore.0912345.xyz
      - BORE_ADMIN_TOKEN=zzzzzzzzzzzzzzzzzzzzz
      - BORE_CERT_FILE=/certs/cert.pem
      - BORE_KEY_FILE=/certs/key.pem
      - BORE_UDP=true
      # ------------------------------------------------------------------
      # HOST PREREQUISITE for BORE_UDP -- the UDP socket buffer (P-13).
      # ------------------------------------------------------------------
      # bore asks every QUIC endpoint's socket for 16MiB inside the endpoint
      # constructor, and the kernel SILENTLY CLAMPS that request to
      # net.core.rmem_max / net.core.wmem_max.
      #
      # THE VALUE THAT PRODUCED THE FAILURE IS NOT THE VALUE TO CHECK. P-13's
      # defect was that the server's SHARED endpoint -- the one serving the
      # direct path of every vhost, public and ssh-jump tunnel in this process,
      # and the RECEIVING side of every download -- never ASKED, so it ran on
      # net.core.rmem_DEFAULT: 212992 bytes, which at 111 MB/s holds 1.9 ms of
      # traffic. It asks now, and what it gets is min(16MiB, net.core.rmem_MAX).
      #
      # CHECK YOUR OWN KERNEL, because that ceiling has moved. MEASURED
      # 2026-09-13 on two AWS hosts running 7.0.0-*-aws, neither of which
      # carries a sysctl file for it:
      #
      #   net.core.rmem_max      4194304   <- kernel default now 4MiB
      #   net.core.wmem_max      4194304
      #   net.core.rmem_default   212992   <- unchanged, and still exactly what
      #                                       an un-asking socket would get
      #
      # Older kernels ship 212992 for all three. So on an older host the clamp
      # sits 16x below the request and IS the P-13 failure; on 7.0 it sits 4x
      # below it and still covers the bandwidth-delay product of a 22 ms,
      # 1 Gbit/s path (2.6 MB) with room left. Raising it to 16MiB has NOT been
      # measured to buy anything on such a path -- the measurement below is the
      # 208KiB case, which is 16x smaller. Raise it when bore warns, and when
      # rate x RTT approaches the ceiling; the socket is ONE per endpoint, so
      # the rate to use is the server's aggregate, not one tunnel's.
      #
      # MEASURED
      # 2026-09-11 (docs/campagna-2026-09-13/evidenze/PUBLIC_STAGING_EVIDENCE_2026-09-11.md
      # section 13.1): the direct arm took IN 3.885 GiB to DELIVER 2.279
      # (1.78x -- retransmission, not per-packet overhead) while the relay
      # arm's inbound and outbound agreed to 0.2 %. It cost half the goodput
      # (111 vs 213 MB/s), double the CPU per delivered GiB and 2.9x softirq.
      #
      # A CONTAINER CANNOT SET THIS ITSELF. net.core.* is global, not
      # per-network-namespace, so a `sysctls:` entry here does not work -- the
      # daemon refuses the container outright. VERIFIED 2026-09-13, Docker
      # 29.8.0:
      #
      #   docker run --sysctl net.core.rmem_max=16777216 alpine:3 true
      #   -> Error response from daemon: ... open sysctl net.core.rmem_max
      #      file: reopen fd 8: permission denied
      #
      # Set it on the HOST instead:
      #
      #   sudo sysctl -w net.core.rmem_max=16777216
      #   sudo sysctl -w net.core.wmem_max=16777216
      #   # persist across reboots:
      #   printf 'net.core.rmem_max=16777216\nnet.core.wmem_max=16777216\n' \
      #     | sudo tee /etc/sysctl.d/99-bore-udp.conf
      #
      # The other half of the remedy is CAP_NET_ADMIN, which lets bore call
      # SO_*BUFFORCE and bypass the clamp -- but Docker clears every capability
      # for a non-root UID even under `privileged`, so that path needs the ROOT
      # image. VERIFIED IN THE FIELD 2026-09-13 on a deployment that DOES set
      # `privileged: true` and still runs as UID 1000: bore logged
      # `recv_forced=false effective_recv=8388608` against a 16777216 request,
      # i.e. privileged bought it nothing and the host ceiling was the only
      # limit that applied. The sysctl is the simpler half and is sufficient on
      # its own: after raising it, the same server logged
      # `effective_recv=33554432 forced=false` and `ss` reported rb33554432
      # with the socket's kernel drop counter back to 0 from 5224.
      #
      # VERIFY FROM THE KERNEL, never from the log: `ss -uapm` on the server
      # and read the rb/tb fields of bore's UDP socket. bore additionally warns
      # on any socket whose 16MiB request survived clamped.
      #
      # DEVIATION from the built-in default of 16: lifts the server-side ceiling
      # so a client may ask for any carrier count it likes.
      # CAVEAT measured 2026-09-11: BORE_UDP_MEMORY_BUDGET derives its
      # per-connection window as clamp(budget / BORE_MAX_CARRIERS, 16MiB, 256MiB),
      # so at 1024 any practical budget lands on the 16MiB floor and then buys only
      # admission slots, never windows. Measured harmless on this deployment (see
      # the budget line below); lower it if you want that arithmetic to behave as
      # documented.
      - BORE_MAX_CARRIERS=1024
      # DEVIATION from the built-in default of 4096: doubled so one direct QUIC
      # connection can carry more concurrent proxied connections before the stream
      # limit binds.
      - BORE_UDP_MAX_STREAMS=8192
      # RECOMMENDED, measured 2026-09-11 (F-13, the direct-UDP aggregate bound).
      # WHY: without it, tunnels x carriers x connection_receive_window has no
      # server-wide ceiling. With 48 slow readers on one --udp tunnel the server
      # process peaked at 340.4 MiB; with it, 42.2 MiB on a 903 MiB host, and the
      # host kept serving instead of starving.
      # COST: none measurable. Priced from a domestic consumer on the QUIC direct
      # path -- the one place the derived 1MiB stream window is the same order as
      # the bandwidth-delay product -- A/B/A/B: ON 53.16/56.25 MB/s vs OFF
      # 52.28/49.72 MB/s. A refused connection stays on the warm TCP relay and
      # increments direct_budget_refusals; it is never a failed request.
      # CONFLICTS with the three window variables below: setting both makes the
      # server refuse to start.
      - BORE_UDP_MEMORY_BUDGET=512MiB
      # BORE_PROXY_BUFFER_SIZE intentionally NOT set -> the built-in 256KiB default
      # applies. This deployment used to force 128KiB. MEASURED 2026-09-11 A/B/A over
      # a 40 ms path, where a copy buffer should bite: 128KiB -> 25.57 MB/s,
      # 256KiB -> 28.53, 128KiB again -> 29.67. The two identical arms differ by 16 %,
      # so the parameter has no effect larger than the drift of the path. Removed so
      # the deployment matches the tested default. Do NOT set it small: the buffer
      # exists because an 8KiB copy loop is a known high-latency regression.
      #
      # Optional: cut the UDP-blackout loss window from 10 s to 4 s. Measured safe to
      # at least 30 % packet loss; QUIC negotiates the minimum of the two peers, so
      # setting it here alone is enough. Gate: scripts/perf/vhost_idle_window.sh
      # - BORE_DIRECT_QUIC_IDLE_MS=4000
      # - BORE_DIRECT_QUIC_KEEPALIVE_MS=1000
      #
      # The five values below are EXACTLY the built-in defaults (verified against
      # /admin/api/v1/config). Leaving them commented is identical to setting them and
      # is preferred, so a future change to the tested defaults is picked up. The first
      # three CONFLICT with BORE_UDP_MEMORY_BUDGET above.
      # KEEP THE 16:1 RATIO between connection and stream window: 64MiB there caused
      # the vhost "asset stuck pending" stall (docs/VHOST_UDP_CONCURRENCY_FIX.md).
#      - BORE_UDP_STREAM_RECEIVE_WINDOW=16MiB
#      - BORE_UDP_CONNECTION_RECEIVE_WINDOW=256MiB
#      - BORE_UDP_SEND_WINDOW=256MiB
#      - BORE_UDP_SOCKET_RECV_BUFFER=16MiB
#      - BORE_UDP_SOCKET_SEND_BUFFER=16MiB
#      - BORE_UDP_MAX_STREAMS=4096   # <- this IS the default, but the ACTIVE setting
#                                    #    above overrides it with 8192. Kept here only
#                                    #    to record what the default is.
      - BORE_VHOST_CONFIG=/config.yml
      - BORE_VHOST_BASE_DOMAIN=bore.0912345.xyz
      - BORE_VHOST_MODE=auto
      - BORE_VHOST_HTTP_PORT=80
      - BORE_VHOST_HTTPS_PORT=443
      - BORE_VHOST_CERT_FILE=/certs/cert.pem
      - BORE_VHOST_KEY_FILE=/certs/key.pem
      - BORE_VHOST_QUIC_PORT=443
      - BORE_CONTROL_HSTS=max-age=31536000; includeSubDomains
      - BORE_VPN=true
      - BORE_VPN_POOL=10.99.0.0/16
      - BORE_VPN_MAX_LINKS=32
      - BORE_WEBSERVER_LOG=/logs
      - BORE_WEBSERVER_LOG_MAX_FILES=5
      - BORE_WEBSERVER_LOG_MAX_FILE_SIZE=50
      #
      # --- SSH ingress gateway (opt-in; disabled here) ---
      # With no BORE_SSH_PORT, SSH demuxes onto the SAME 443:7835 mapping
      # above alongside TLS/HTTP/native bore — no extra port to publish. See
      # docs/SSH_GATEWAY.md. Requires an authorized-keys dir and/or a
      # password file (generate with `bore hash-password`) mounted below.
      # - BORE_SSH_GATEWAY=true
      # - BORE_SSH_HOST_KEY_FILE=/etc/bore/ssh/host_key.pem
      # - BORE_SSH_AUTHORIZED_KEYS_DIR=/etc/bore/ssh/authorized_keys.d
      # - BORE_SSH_PASSWORDS_FILE=/etc/bore/ssh/passwords

    volumes:
      - ./certs:/certs:ro
      - ./config.yml:/config.yml:ro
      - ./logs:/logs:rw
      # - ./ssh:/etc/bore/ssh   # NOT :ro — see docker-compose.server.yml's comment
