# bore secret proxy (`bore proxy`) — host network.
#
#   docker compose -f docker-compose.secret-proxy.yml up -d
#
# Connects to a named secret tunnel and exposes it on a local port. Host
# networking binds that port directly on the host (reachable by other machines).

services:
  bore-secret-proxy:
    image: ${BORE_IMAGE:-ghcr.io/manprint/bore:latest}
    # With --udp / BORE_PREFER_UDP use the ROOT image and grant NET_ADMIN:
    #   image: ghcr.io/manprint/bore:client
    #   privileged: true            # or: cap_add: [NET_ADMIN]
    # Docker clears every capability for a non-root UID (even under privileged),
    # so the default uid-1000 image cannot call SO_*BUFFORCE and the direct UDP
    # path stays clamped to net.core.{r,w}mem_max (WARN on every socket).
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    container_name: bore-secret-proxy
    command: ["proxy"]
    restart: unless-stopped
    network_mode: host
    environment:
      - BORE_SERVER=bore.tld              # --to; may be http(s)://bore.tld[:port]
      - BORE_LOCAL_PROXY_PORT=:5555       # local listen address (":5555" = all interfaces)
      - BORE_TCP_SECRET_ID=my-service     # must match the provider's tcp-secret-id
      - BORE_SECRET=change-me
      - BORE_AUTO_RECONNECT=true
      # Prefer a direct UDP hole-punched path to the provider (falls back to the
      # relay if it can't be established). The server must run with BORE_UDP=true
      # and the provider with BORE_PREFER_UDP=true.
      - BORE_PREFER_UDP=true
      # STUN server for UDP candidate discovery; defaults to the bore server's
      # control endpoint. Override only if the server is not also the STUN server:
      # - BORE_STUN_SERVER=stun.l.google.com:19302
      # Bind the UDP hole-punch socket to a fixed port (0=random). Open it for
      # egress in a strict firewall, same value on both peers, for the direct path:
      # - BORE_NAT_UDP_PORT=41641
      # Hole-punch helpers for the direct UDP path (all opt-in, relay is never
      # affected):
      # Try UPnP-IGD/PCP to map a port on the local router (no effect behind CGNAT).
      # - BORE_UPNP=true
      # Also advertise predicted symmetric-NAT ports as candidates. Best-effort; may
      # look like a port scan to a strict firewall.
      # - BORE_TRY_PORT_PREDICTION=true
      # Manual candidate(s) IP:PORT: your own PUBLIC endpoint (static port-forward,
      # public IP). Comma-separated, advertised first.
      # - BORE_UDP_CANDIDATES=203.0.113.7:41641
      # Skip STUN entirely and rely on manual/local/mapped candidates only (with no
      # BORE_UDP_CANDIDATES this almost certainly stays on the relay).
      # - BORE_UDP_NO_STUN=true
      # Seconds to keep using ephemeral ports after the NAT remapped the preferred
      # port (BORE_NAT_UDP_PORT), so the old mapping can expire. Default 600; 0 = off.
      # - BORE_NAT_UDP_RELEASE_TIMEOUT=600
      # Label this proxy on the server's admin status page:
      # - BORE_NOTES=consumer on laptop
      # Open N parallel TCP carrier connections for the relay data path (this
      # consumer -> server leg) and round-robin forwarded connections across them,
      # avoiding single-connection head-of-line blocking under concurrency (e.g.
      # many parallel transfers). 1 = single connection. (Only affects the relay
      # path; a direct UDP path already uses independent native QUIC streams.)
      # MEASURED 2026-09-11: same rule as the vhost provider -- 1 for a single bulk
      # transfer (carriers split one flow's congestion window), 8 when small
      # requests share the tunnel with bulk, 0 (adaptive) when the mix is unknown.
      # - BORE_CARRIERS=4
      # Per-direction copy buffer for the local-forward splice. Default 256KiB;
      # KB/MB/GB/KiB/MiB/GiB suffix, clamped [4KiB,16MiB]. Raise on high-latency
      # links; does not help single-stream throughput on a low-latency link.
      # MEASURED 2026-09-11 over a 40 ms path: 128KiB and 256KiB are
      # indistinguishable, so leave it unset unless you measure your own path.
      # - BORE_PROXY_BUFFER_SIZE=1MiB
      # Accept a self-signed server certificate for an https:// control address:
      # - BORE_INSECURE=true
