# TCP 443 protocol/SNI dispatcher for bore and the HTTPS sites already served
# by nginx. This file is included from the top-level `stream {}` context.

# A non-TLS client on 443 is either plain SSH or a plain native bore client.
map $ssl_preread_protocol $bore_is_tls {
    ""      0;
    default 1;
}

# Native bore-over-TLS advertises ALPN "bore". SSH-over-TLS advertises "ssh".
map $ssl_preread_alpn_protocols $bore_protocol_alpn {
    default                    0;
    ~(^|,)(bore|ssh)(,|$)      1;
}

# Replace bore.example.com in all three entries before installation.
map $ssl_preread_server_name $bore_sni_class {
    default                                                        existing_https;
    bore.example.com                                               control;
    files.bore.example.com                                         control;
    ~^[a-z0-9-]+\.bore\.example\.com$ vhost;
}

# Routing priority:
#   1. non-TLS SSH/native bore -> unified bore control listener;
#   2. ALPN bore/ssh          -> unified bore control listener;
#   3. browser control names  -> unified bore HTTPS/admin/web-transfer;
#   4. browser wildcard names -> bore vhost HTTPS frontend;
#   5. everything else       -> the existing nginx HTTPS virtual hosts.
map "$bore_is_tls:$bore_protocol_alpn:$bore_sni_class" $bore_tcp_upstream {
    default          127.0.0.1:8443;
    ~^0:             127.0.0.1:7835;
    ~^1:1:           127.0.0.1:7835;
    "1:0:control"    127.0.0.1:7835;
    "1:0:vhost"      127.0.0.1:8444;
}

server {
    listen 443 reuseport;
    listen [::]:443 reuseport ipv6only=on;

    ssl_preread on;
    proxy_pass $bore_tcp_upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 7d;
    proxy_half_close on;
}
